let roots=legal(rootPos).filter(m=>inCheck(apply(rootPos,m),attacker==='w'?'b':'w'));\n  if(inCheck(rootPos,attacker))roots=legal(rootPos);\n  // Checks that capture/promote are examined first, but no legal checking candidate is discarded.\n  roots.sort((a,b)=>(b.x?2:0)+(b.pr?1:0)-(a.x?2:0)-(a.pr?1:0));\n  for(const m of roots){\n    const child=apply(rootPos,m);\n    if(isCheckmate(child))return m;\n    if(visit(child,1))return m;\n    if(aborted)break;\n  }\n  return null;\n}\n\n\n// ---- Bot resignation (normal games). Tuned per bot; bots never resign early. ----\nconst RSGN={n:0,gid:-1};\nconst RSG_RULES={sophia:{cp:650,k:3,age:13,min:36},leon:{cp:500,k:2,age:12,min:30},andrew:{cp:900,k:5,age:12,min:50},misha:{cp:1100,k:4,age:17,min:40},nikolai:{cp:600,k:3,age:14,min:36},lucien:{cp:600,k:3,age:13,min:36},isabella:{cp:700,k:3,age:12,min:34}};\nconst RSG_LINES={\n leon:['Hm. Nothing works here. Good game. I resign.','I see no defence left. You earned this one. I resign.','Well played. I have no more moves worth making. I resign.'],\n sophia:['The painting is finished, and it is yours. I resign.','No colours left to try. Well played. I resign.'],\n andrew:['Okay okay, it is lost. I resign. Rematch!','Fine. You win. I resign. Fast rematch?'],\n misha:['Too quiet now. Nothing left to sacrifice. I resign.','You survived the chaos. I resign.'],\n isabella:['You figured it out. I resign.','I did not see that plan. I resign.'],\n lucien:['Every square is gone. Good game. I resign.','You found the space. I resign.'],\n nikolai:['I read it wrong. You were steadier. I resign.','No pressure left to apply. I resign.']};\nfunction botShouldResign(age){\n  const R=RSG_RULES[BOT];\n  if(!R||over||TC.flag)return false;\n  if(RSGN.gid!==gid){RSGN.gid=gid;RSGN.n=0}\n  let a=age;\n  try{const T=BOT==='misha'?window.MISHA_AGES:BOT==='nikolai'?window.NIK_AGES:BOT==='lucien'?window.LUC_AGES:BOT==='isabella'?window.ISA_AGES:null;if(T){const q=T.find(x=>x.v==age);a=q?+q.a:0}}catch(e){}\n  const sc=STY.score;\n  if(typeof sc!=='number'||Math.abs(sc)>=90000||a<R.age||uci.length<R.min){RSGN.n=0;return false}\n  if(sc<=-R.cp)RSGN.n++;else RSGN.n=0;\n  return RSGN.n>=R.k;\n}\nfunction botResign(){\n  over=true;gid++;wReset();busy=false;sel=-1;targets=[];\n  statusEl.className='over';\n  statusEl.textContent=BN()+' resigns. You win!';\n  try{const L=RSG_LINES[BOT]||['I resign.'];type(L[Math.floor(Math.random()*L.length)])}catch(e){}\n  render();updClock();\n}\nfunction botTurn(){\n  busy=true;render();\n  if(sinceSay>=3&&Math.random()<.12){sinceSay=0;say('think')}\n  const lv=BOT==='athena'?1:+$('lvl').value,id=gid,emoOn=$('mode').value==='heart',age=BOT==='athena'?8:+$('age').value;\n  setTimeout(async()=>{\n    if(id!==gid)return;\n    const t0=Date.now();\n    // Critical low-clock rule: checkmate takes priority over every personality,\n    // opening book, and ordinary move search. Probe for a forced mating line\n    // before the normal search can consume the remaining clock.\n    if(TC.on&&TC.t[S.turn]<=12000){\n      let urgentMate=legal(S).find(x=>{const n=apply(S,x);return inCheck(n,n.turn)&&legal(n).length===0});\n      if(!urgentMate){\n        const rem=Math.max(0,TC.t[S.turn]);\n        urgentMate=findForcedMateMove(S,5,7000,Math.min(85,Math.max(20,rem*.012)));\n      }\n      if(urgentMate){\n        STY.cands='';STY.sac='';STY.dng=false;STY.score=100000;STY.bk='';\n        wasBook=false;busy=false;play(urgentMate);return;\n      }\n    }\n    if(BOT==='sophia'&&TC.on&&TC.t[S.turn]<=10000){\n      // Low on time: no book, no deliberation. Mate in 1 if it exists, otherwise a near-instant search.\n      let lm=legal(S).find(x=>{const n=apply(S,x);return inCheck(n,n.turn)&&legal(n).length===0});\n      STY.cands='';STY.sac='';STY.dng=false;STY.score=lm?100000:undefined;STY.bk='';\n      if(!lm){HARD=70;TGT=0;try{lm=await askBest(S,lv,false,null,age)}catch(e){}if(id!==gid)return;if(!lm)lm=legal(S)[0]}\n      try{setEval(STY.score!==undefined?STY.score:neutralEval(S))}catch(e){}\n      wasBook=false;busy=false;if(lm)play(lm);return;\n    }\n    if(!emoOn&&BOT==='sophia')updatePlan(S);else{PLAN.name='';PLAN.txt='';PLAN.files=[]}\n    // Andrew's signature rule: as Black, answer White's first move with ...c5\n    // whenever the move is legal. Against 1.e4 this enters the Sicilian; against\n    // other first moves he still plays ...c5 as his fixed repertoire choice.\n    let bk=null;\n    const fastTC=!!(typeof TC!=='undefined'&&TC.on&&TC.base<=5);\n    if(BOT==='andrew' && S.turn==='b' && uci.length===1) {\n      const e5=fastTC&&uci[0]==='e2e4'?legal(S).find(x=>sqn(x.f)+sqn(x.t)==='e7e5'):null;\n      bk=e5||legal(S).find(x=>sqn(x.f)+sqn(x.t)==='c7c5')||null;\n      if(bk){AND.line=null;STY.bk=e5?'Andrew: ...e5 (Bongcloud set-up)':'Andrew: ...c5 (signature response)';}\n    }\n    if(!bk&&BOT==='andrew'&&fastTC&&S.turn==='b'&&uci.length===3&&uci[0]==='e2e4'&&uci[1]==='e7e5'){\n      const kb=legal(S).find(x=>sqn(x.f)+sqn(x.t)==='e8e7');\n      if(kb&&hangThr(apply(S,kb))<=0){bk=kb;AND.line=null;STY.bk='Andrew: Bongcloud, ...Ke7'}\n    }\n    if(!bk)bk=BOT==='andrew'?andrewBook(S,age):BOT==='athena'?athenaBook(S):BOT==='leon'?leonBook(S,age):(age>=11?bookMove(S):null);\n    if(bk){\n      const forcedC5=BOT==='andrew' && S.turn==='b' && uci.length===1 && (sqn(bk.f)+sqn(bk.t)==='c7c5'||sqn(bk.f)+sqn(bk.t)==='e7e5');\n      if(!forcedC5){const ok=await askSafe(S,bk);if(id!==gid)return;if(!ok){bk=null;STY.line=null;STY.bk=''}}\n    }\n    STY.cands='';STY.sac='';STY.dng=false;STY.score=undefined;\n    let emo=null,emoCh=false;\n    if(emoOn){try{const f=feel(S);emo=f.m;emoCh=f.ch}catch(e){emo='focused'}}\n    let m=bk;if(!m){const pl=tcPlan();HARD=pl.hard;TGT=pl.tgt;m=await askBest(S,lv,!emoOn&&BOT!=='andrew',emo,age);if(id!==gid)return;}\n    // A forced checkmate outranks every opening preference, mood, or stylistic choice.\n    // This runs in each bot page, including the hidden pages used by Bots vs Bots.\n    const forcedMate=await findForcedMateMoveAsync(S,5,11000,140);if(id!==gid)return;\n    if(forcedMate){m=forcedMate;bk=null;STY.bk='';\n      if(BOT==='sophia'&&!emoOn&&age>=11)m=artisticMateChoice(S,m);\n    }\n    try{setEval(!bk&&STY.score!==undefined?STY.score:neutralEval(S))}catch(e){}\n    // Resignation: strong bots resign only after several consecutive hopeless evaluations.\n    if(!bk&&!window.__ARENA_CHILD&&botShouldResign(age)){botResign();return}\n    const wb=wasBook;wasBook=!!bk;\n    let sp=false;\n    if(age<11){try{sp=speakAge(age)}catch(e){}}\n    if(!sp&&emoOn){try{sp=speakEmo(emo,emoCh)}catch(e){}}\n    if(!sp&&age>=11&&age<15){try{sp=speakAge(age)}catch(e){}}\n    MUTE=sp;try{speak(S,m,bk,wb)}finally{MUTE=false}\n    if(emoOn){try{emoFace(emo)}catch(e){}}\n    try{if(emoOn)$('plan').textContent='';else $('plan').textContent=(PLAN.txt.trim()+' Key feature: '+keyFeature(S)+'.'+(!bk&&STY.cands?' Considered: '+STY.cands+'.':'')+(!bk&&STY.sac?' '+STY.sac:'')).trim()}catch(e){}\n    const AN=BOT==='andrew';const want=bk?(AN?250+Math.random()*350:700+Math.random()*1300):emoOn?emoWant(emo):(AN?450+Math.random()*450:1000+Math.random()*900);\n    // Keep only a short post-search pause; the actual calculation budget is set in tcPlan().\n    let wt=want;\n    if(TC.on){const bud=tcBudget(),f=bk?(AN?.08+Math.random()*.1:.1+Math.random()*.15):(AN?.15+Math.random()*.2:.3+Math.random()*.3);wt=window.__ARENA_CHILD?want:Math.max(250,Math.min(want,bud*f*.15))}\n    setTimeout(()=>{if(id!==gid)return;busy=false;if(m)play(m)},Math.max(0,(TC.on?Math.min(wt,tcBudget()*.6):wt)-(Date.now()-t0)));\n  },TC.on?40:520);\n}\nboardEl.addEventListener('click',e=>{\n  const el=e.target.closest('.sq');\n  if(!el||busy||over||S.turn!==me)return;\n  const i=+el.dataset.i;\n  if(athenaVineEnabled()&&ATH_VINE_TARGET>=0&&sel===ATH_VINE_TARGET){athenaVineDefiance();sel=-1;targets=[];render();return}\n  if(athenaVineEnabled()&&ATH_VINE_TARGET===i&&S.b[i]&&isW(S.b[i])===(me==='w')){athenaVineDefiance();sel=-1;targets=[];render();return}\n  const mv=targets.find(m=>m.t===i);\n  if(mv){play(mv);return}\n  const p=S.b[i];\n  if(p&&isW(p)===(me==='w')){\n    sel=i;targets=legal(S).filter(m=>m.f===i);\n  }else{sel=-1;targets=[]}\n  render();\n});\nconst LINES={\nstartW:['I’ll begin. Watch the first stroke.','White is mine. Let’s see what you paint back.','A blank canvas, and I get the first mark.','Settle in. I like to start slowly.','The brush is wet. I’ll open.','Every coil begins with a small curve.','I’ll take white. Patience is my favourite colour.','First stroke is mine. Try to read it.','Let’s make something worth looking at.','The snake moves first. Breathe.'],\nstartB:['You open, I answer. Show me your first colour.','Black suits me. I do my best work in shadow.','Go ahead. I’ll be watching from the coil.','Paint your opening. I’ll find the gaps.','I’m in no hurry. Make your move.','A blank canvas, and you hold the brush first.','Dark pigment, steady hand. Begin.','Let’s see how you start. I’ll learn from it.','Your move. I’m very good at waiting.','Make your mark. I’ll make mine over it.'],\nopen_e4:['The king’s pawn. Classic, and a little loud.','e4. Direct. I like it, and I’ll answer in kind.','Straight into the centre. Fine, let’s paint there.','The oldest opening stroke. Respectable.','e4, always e4. Predictable colour.'],\nopen_d4:['d4. Quiet, heavy, deliberate. I respect that.','The queen’s pawn. A slower, wider brush.','d4 — you want space. We’ll see who keeps it.','A solid start. I’ll look for the cracks.','d4. Patient. We might get along.'],\nopen_nf3:['Nf3, keeping all options wet. Clever.','A knight first. You don’t show your hand early.','Nf3. Flexible, a little sly. I like that.','Hmm, a knight. Hard to read. Good.'],\nopen_c4:['The English. A sideways stroke. Interesting.','c4 — you’re painting from the edge in.','An unusual start. Let me find my footing.','c4. You like to come from the flank.'],\nopen_other:['That’s a rare way to start. I’m intrigued.','Unusual. I’ll need a moment with that one.','A strange first stroke. Let’s see where it goes.','You’ve left the well-worn path. So will I.','I haven’t seen that one in a while. Welcome.'],\ngambit:['I’m playing the {g}. A pawn is just wet paint.','The {g}. I’ll offer something and take it back later.','Let’s try the {g}. I’m not afraid to spill a little.','{g}. Material comes and goes. Initiative stays.','The {g}, for the sake of art.','Think of the {g} as a gift with a hook in it.','{g}. I give a little to get a lot.','You’ll notice I’m playing the {g}. Do you accept?','Time for the {g}. Let’s make this interesting.','The {g} — a small sacrifice, a big promise.','I picked the {g} for you. Don’t say I never gave you anything.','{g}. Every masterpiece starts with a risk.','The {g}. I love a position that bites back.','Offering you the {g}. Take your time deciding.','{g}. I’m not here to play safe.','Ah, the {g}. An old friend with a sharp smile.','I thought the {g} suited this mood.','The {g} is just an invitation. Accept at your own risk.','{g}. Your pawns look tempting, so I’ll tempt you back.','Let’s see how you handle the {g}.'],\nbook:['I know this line. It’s a pretty one.','Still following the pattern I like.','This is where the colours are meant to go.','Keeping to the sketch for now.','Theory is only a drawing; I’ll colour it in myself.','Familiar ground. Don’t relax yet.','The line continues, as planned.','I’ve walked this path before.','Everything is in its place so far.','A well-known stroke. Nothing surprising yet.','Following the old masters for a moment.','This part, I can play with my eyes closed.','The sketch is clear. Now it gets harder.','Right on the outline.'],\nbookEnd:['And now the sketch ends. I’m on my own.','The book is closed. Time to improvise.','No more map. Let’s see what I can paint.','Out of theory now. This is where I breathe.','You’ve left the drawing. I’ll follow the shape you make.','That’s the end of what I memorised. The rest is me.','Now we’re off the page. I like it here.','Free hand from here. No guides.','The pattern is finished. The art begins.','Out of the book. Let’s find our own line.','From here on, nothing is borrowed.','The canvas is open. Careful where you step.'],\nquiet:['A small stroke. Don’t mind it.','Nothing happening here. Nothing at all.','Just tidying my corner of the canvas.','Quiet moves are the ones that matter most.','A little shading, nothing more.','I’m improving a piece nobody is looking at.','Slow hands make the cleanest lines.','Patience. The picture isn’t finished.','A soft stroke before a hard one.','Building the background.','I’m in no hurry.','This move says very little. That’s the point.','Mixing colour. It takes a while.','Every piece needs a better square.','You may think I’m wandering. I’m not.','Let the pigment dry.','Pretend I’m not planning anything.','A gentle curve for a tight coil.','One careful brushstroke after another.','Not every move needs a flourish.','Small steps. I’ve got all day.','I’m moving my worst piece. Everyone has one.','Tension is built from calm.','Do you notice the pattern forming? Maybe not yet.','Developing in silence.','The loudest strokes come last.','A bit of weight here, a bit there.','I like the shape of this position.','Careful. I’m tightening something.','Just a thin layer, for now.','You’re thinking too much about this one.','Quiet. Let it settle.','I’m measuring distances.','Setting the stage.','Nothing to see. Keep looking, though.','A brush kiss, not a strike.','I’m turning the canvas a little.','Soft hands, sharp teeth.','Everything has a purpose, even this.','Coiling a little tighter.'],\ncapture:['That one’s mine now.','Taken. The canvas has a new colour.','A bite. Small, but it counts.','I’ll keep that, thank you.','Something had to be removed.','A clean cut.','You left that near my reach.','I swallow it whole. Quietly.','One less brush for you.','I took it, and I’ll use it well.','Captured. Don’t look so surprised.','Piece by piece, the picture changes.','That square was too inviting.','Dust off. It’s mine.','A snake always finishes what it started.','Taken with a smile.','I wasn’t going to leave that there.','A little pigment lost.','That was exposed. I noticed.','Sorry. I’ll make good use of it.','Another stroke wiped away.','Your piece, my square.','A tidy exchange.','Fair is fair.'],\ncheck:['Check. Your king should be careful.','A little warning from the coil.','Check. Breathe.','Your king flinched. I saw it.','Check — and I’m only warming up.','Hiss. Check.','Move your king, or take cover.','A nudge, to see how you react.','Check. I’ll keep my voice down.','Look at me. Check.','Your king is in my shadow.','A sharp little stroke. Check.','Check. Don’t panic.','I wanted to see you think.','Check, with good manners.','Run, if you like.','The first fang. Check.','Your king isn’t as safe as it looked.'],\ncastle:['Tucking my king away safely.','Castled. Now I can be reckless.','A safe house, so I can play dangerous.','Rooks connected, king hidden. Better.','Now I can start the real painting.','Safety first. Mischief second.','Castling, because snakes protect their heads.','Tucked in. Come and find me.','King sorted. Time to focus.','There. Now I don’t have to worry.'],\nattack:['Now. The painting ends and the strike begins.','You’ve had your quiet. I’m done with mine.','Everything I’ve built points at your king.','Every stroke so far was preparation. Now you see it.','Hold still. This won’t take long.','The coil tightens. The pieces are ready.','Do you feel it? The room just got smaller.','I’ve been patient. Now I’m not.','That was the sketch. This is the finished work.','Look at where all my pieces are looking.','Now the whole canvas turns on you.','Quiet is over. Let’s go.','Too late to run. I already planned this.','The brush becomes a fang.'],\natkMove:['More. All of it, at once.','I have a lot more where that came from.','Every move now carries a threat.','Keep up if you can.','Faster, now. No pauses.','I’m not slowing down.','The pressure builds. Hear it?','You have fewer squares than you think.','Another piece joins the strike.','Everything flows toward your king.','There’s no gentle way to say this.','This is the part I practised.','Don’t look at the board. Look at the coil.','Tightening. Tightening.','Crushing, softly.','I don’t need all my pieces. Just enough.','The canvas is on fire.','Your defences are getting thin.','One more turn of the screw.','Can you see all the threats? Neither can I. There are too many.'],\nblunder:['Oh. That wasn’t what I expected from you.','I think you just gave me something.','That square was a mistake.','Careful. That was loose.','You may regret that one.','I’ll take the gift, thank you.','That was not the best brushstroke.','A smudge on your canvas.','You blinked, and I noticed.','Oh no. Oh, I’m sorry. Not really.','That helps me.','I didn’t even have to try.','That one left a hole.','I’ve been waiting for you to do that.','An unforced error. They’re my favourites.','The picture just tilted my way.','Thank you. That simplifies things.','That’s a very kind move for me.','I see a crack, and I’m going in.','You hesitated, and the line shifted.'],\npraise:['Good move. I didn’t expect that.','Nicely done. I felt that one.','That’s a fine stroke. I’ll need to rethink.','You’re better than you look. Compliment.','Interesting. Very interesting.','Careful, that was precise.','I like that. It annoys me, but I like it.','That’s the move I was afraid of.','A strong reply. I’ll adapt.','Good eye. Truly.','You found something I missed.','Well painted.','That actually hurt a little.','Hm. You see more than I thought.','Fine. I’ll earn this one.','Respect. That’s not easy to find.','Very good. I’m now paying attention.','A clever move. Let’s see if you can repeat it.'],\ndanger:['Careful. You’re closer to my king than I’d like.','That’s a sharp pressure. I’m defending.','You’re cornering me. I don’t enjoy that.','I’m under fire. Interesting.','A snake bites back when trapped.','My king is nervous. Good for you.','You have a real attack. Don’t waste it.','I need a moment. Let me defend carefully.','Pressure noted. I’ll deal with it.','Wow. All right, I’ll take this seriously.','Not now. Not on my watch.','This is the part where I stop painting.','I’ll hold. And then I’ll bite.','You’ve found my weak spot. I’ll cover it.'],\nahead:['I’m a little ahead. That calms me.','Better trade down, I think.','Now I just have to stay careful.','Ahead on points. Don’t make me regret it.','Simplify. Stay safe. Win.','I’m comfortable. Don’t take that as a compliment.','Material is on my side. Time is, too.','A lead is a delicate thing. I’ll protect it.','I’ll trade pieces now. Less to worry about.','Convert, convert, convert.'],\nbehind:['I’m behind. That’s fine. That’s when I’m most creative.','Down material. Time to make trouble.','I’ll need counterplay. Let me find some.','You’re ahead. For now.','Don’t get comfortable.','I’m behind, but I’ve got teeth.','Passive defence never works. I’ll attack.','I’ll make this uncomfortable for you.','The picture’s not over yet.','A small setback. I’ll improvise.','You have more pieces. I have more patience.','Careful. A cornered snake is dangerous.'],\nendgame:['Fewer pieces now. The canvas is quiet.','Endgames are honest. No place to hide.','Just kings and a few friends. Beautiful.','The crowd leaves, the real work starts.','Now every move counts twice.','Simple pieces, deep calculation.','Time to stop painting and start counting.','This is where I slow down.','An endgame. Let’s see who knows their craft.','The quiet part. My favourite.'],\nqueenOut:['The queen already? Bold.','A queen out so early. I’ll chase her.','She’ll be a target there.','That queen looks lonely out there.','Bringing your queen so soon? I’ll make use of that.','Early queen. That wastes time.','Your queen can’t hide forever.','I see your queen. I see where she’ll have to run.'],\nplayerCapture:['You took my piece. That was rude.','Fair trade? We’ll see.','That was mine. I’ll remember it.','You’re collecting my pigments.','Fine, take it. I’ll take something later.','A bold capture. I hope it’s worth it.','I’ll get that back. With interest.','You’re greedy. I like that in an opponent.','Hmm. I didn’t think you’d go for that.','Noted. Every capture changes the picture.','A pawn is just a pawn. I’ll be fine.','That square wasn’t protected enough.'],\nplayerCheck:['Check? Oh, that’s cute.','You gave me a fright. A small one.','Fine, I’ll move.','Noted. I’ll handle that.','A little nudge. I’ll answer it.','You’re getting bold.','Check. I see you.','My king steps aside. Politely.','That was forceful. Good.','I’ll deal with that right away.'],\nmateWin:['Checkmate. The coil is complete.','That’s it. The painting is finished.','Mate. You played well, but I was patient.','The snake wins. Thank you for the game.','Checkmate. It was a lovely canvas.','Mate. I hope you enjoyed the strike.','All done. I’ll sign it for you.','Gently, gently — checkmate.','It was close in places. Good game.','The final stroke. Well played.'],\nmateLoss:['Checkmate. I… didn’t see that coming.','You got me. Beautifully done.','I’ve been bitten. Fair enough.','Mate. Well played, truly.','The canvas is yours. Congratulations.','Ah. A very clean finish.','I lost. I’ll remember how.','You earned that. Good game.','You painted the last stroke. I concede.','Checkmate. Let me study this one.'],\ndraw:['A draw. Neither of us blinked.','Honourable stalemate. A well-balanced canvas.','Nobody wins, nobody loses. I can live with that.','A draw. We’ll settle it next time.','Equal ink on both sides. Well done.','Stillness. A fitting end.','Half a point each. A fair finish.','A quiet ending. Good game.'],\nundo:['Taking it back? Fine. The canvas forgives.','Rewinding. I’ll pretend I didn’t see.','A second chance. Don’t waste it.','Let’s paint that one again.','Undo. I’ll remember, though.','Erasing a stroke. Rare mercy.','As you wish. Back we go.','New attempt. Make it better.'],\nhint:['Peeking at my notes? Clever.','A hint. Use it well.','You asked, so I looked. Here.','Cheating a little? I approve.','I’ll point you somewhere. No promises.','That’s what I’d consider. Maybe.','A small gift. Don’t let it go to your head.','Take the hint. Or don’t.'],\nthink:['Hm. Let me look at this.','Give me a moment with the canvas.','Thinking. Don’t rush me.','I’m reading the picture.','Let me weigh this.','One second. Something’s interesting.','Where should the next mark go?','I’m looking for the quiet detail.','Let me taste the position.','Mm. Interesting choice.','Hold on, I’m calculating.','Counting stroke by stroke.','There’s something here. Let me find it.','Looking for the weakest thread.','Don’t hurry. The best marks take time.','I’m listening to the board.','Let me coil around this one.','A moment. I’m mixing something.']\n};\n\n\nLINES.trash=['I’d call this a masterpiece, but I’m only on the underpainting.','Your position has the charm of a sandcastle at high tide.','Not to rush you, but the tide is coming in.','You could still win. In a parallel universe, probably.','Everything’s fine! Mostly. For me, anyway.','I’d offer a draw, but I’m having far too much fun.','You’re doing great, for someone who’s losing.','Chin up. The endgame is long. I’m kidding, it’s not.','I’m not saying I’m winning. I’m saying I’m comfortable.','Don’t worry, I’ll sign the painting with both our names.','Your king is looking for exits. I’d hold the door, but I’m busy.','It’s not personal. It’s just very, very artistic.','I’d tell you what you did wrong, but I’m enjoying the silence.','Take your time. It won’t change the outcome, but take it anyway.','You play with such optimism. I admire that.','This is the part where I pretend to feel sorry.','I’ll be gentle. Mostly.','Everything’s going according to plan. Mine.','I’ve seen worse positions. Not many, but I’ve seen them.','Bravery is not the same as winning, but I appreciate it.','You’re a good sport. I like that in a canvas.','At this point I’m just admiring my own brushwork.','Let’s call it an educational experience.','You’ve got a lovely attacking idea. Somewhere. Probably.','I could pretend to be nervous. Should I?','I’m ahead, but I’m humble about it. Mostly.','Ssssorry, I mean, not really.','Don’t blink, you’ll miss how I win.','I’m beginning to think you’ve given up the centre on purpose. Bold.','I’d say it’s close, but I’d be lying beautifully.','Your pieces are very polite. They keep letting me through.','You’re playing nicely. I’m just playing better.','If I look smug, it’s the lighting.','I’ll make this quick. Okay, no, I’ll make it artful.','Think of me as an art critic with fangs.','Good effort. I’m enjoying every minute.','You’re a worthy opponent. For now.','You make this look easy. For me.','The silence from your side is very flattering.','You’re one clever move from a miracle. Take a deep breath.'];\nLINES.trashCap=['Mmm, thank you for the donation.','I do love a free sample.','Delicious. Please, send more.','That one tasted like victory.','Oops. Was that yours?','I’ll put it on your tab.','You brought that piece for me, didn’t you?','Thank you! I’ll use it well.','One for the collection.','I’d say sorry, but I’m a snake.','Excuse me, I’m just collecting my winnings.','The canvas thanks you for the pigment.','A little taste of what’s coming.','Chomp. Pardon my manners.','Oh, that was loose. Lucky me.','I’ll frame that piece later.'];\nLINES.trashCheck=['Knock knock. Who’s there? Check.','Your king dropped something. His composure.','Excuse me, your majesty. Step aside, please.','Hello, king. Are you comfortable?','Check! Don’t take it personally. Take it as art.','A little poke to see if you’re awake.','Hiss. Check. You know the rules.','Your king looks tired. Let me help him move.','A courtesy check. Very polite.','Check, and I said it nicely.','You’re welcome for the exercise.','Your king is doing cardio now.','Looks like your king needs a new address.','Check! Don’t forget to breathe.'];\nLINES.mateWin.push('Checkmate! Don’t take it personally. Take it as art.','That’s mate. Good game, and thank you for the canvas.','Mate. Please, enjoy the view from the other side of the fangs.','I won, but you made it interesting. Thank you.','Checkmate. I’d say better luck next time, but you’ll just get better.','And that, as they say, is a wrap. Beautiful game.','The painting is complete. I’m very proud of it, and slightly of you.','Mate. I’ll buy you a coffee in my imagination.');\nconst SAYH={};\nconst SM={calm:'M33 59Q40 63 47 59',smug:'M32 59Q41 66 50 56',worried:'M33 62Q40 56 47 62',impressed:'M34 58Q40 65 46 58',think:'M34 60L46 60'};\nconst MOOD={smug:['trash','trashCap','trashCheck','attack','atkMove','blunder','mateWin','ahead','capture','check','gambit'],worried:['danger','behind','mateLoss'],impressed:['praise'],think:['think','hint']};\n\nLINES.sac=['A small investment: {n}. I expect it back in activity.','I’m giving up {n}. Watch what it buys me.','Sacrifice, but I did the arithmetic first.','{n} is just wet paint. The picture comes first.','Yes, I’m offering {n}. No, it isn’t reckless.','I checked every defence before spending {n}.'];\nLINES.sacNo=['I looked at that sacrifice and the sums didn’t hold. Declined.','Tempting, but it only works if you cooperate. Quiet move instead.','A beautiful idea that doesn’t survive the best defence. I’ll pass.','I checked the sacrifice and it didn’t pay. Patience instead.','Pretty, but unsound. I’d rather be right than dramatic.'];\nLINES.outpost=['That square is mine now. Nothing can chase it away.','A piece on a square no pawn can reach. I like that.','Planted. Let them try to dislodge it.','An outpost. Quiet, permanent, uncomfortable for you.','Some squares are made for one piece. This is that square.'];\nLINES.planNew=['New plan: {p}. The old one stopped fitting the position.','You found the defence, so I’m changing the picture: {p}.','Plans should bend when the board does. Now: {p}.','Time to repaint. The new idea is {p}.'];\nLINES.quiet=LINES.quiet.concat(['Improving my worst piece.','Keeping an eye on both wings.','Solid, if unexciting.','Tying up a loose end.','A useful waiting move.','Tidying the structure.','Giving the king some air.','Covering a weak square.','A small adjustment.','Watching for your next idea.','Keeping my options open.','Holding things together.','Rerouting a piece.','Slow and steady.','Checking the long diagonal.','Not every move needs a plan.']);\nLINES.develop=['Knight out. Nothing fancy.','Getting the pieces off the back rank.','Development first, always.','A knight wants to be near the middle.','Bringing a bishop into the picture.','Pieces before pawns, mostly.','Better square, better piece.','Making room for the rest.','One more piece in play.','Let the army come out.','A calm developing move.','That bishop was boxed in.','Activating the minor pieces.','Coming out to play.'];\nLINES.centre=['Taking a bit of the centre.','The middle is worth fighting for.','A pawn where it matters.','Space is cheap now and expensive later.','Staking a claim in the middle.','I’d like some room to move.','The centre decides a lot of games.','A small claim, for now.','Planting a pawn.','Contesting the middle.'];\nLINES.rookOpen=['A rook on an open file feels right.','Open file. The rook approves.','Rooks like long lines.','Putting the rook to work.','That file was empty. Not anymore.','Rook to a better home.','Heavy piece, open road.','The rook finally has something to look at.'];\nLINES.trade=['An even trade. I’m fine with that.','Exchanging. The position gets clearer.','Piece for piece. Fair.','Simplifying a little.','Trading off a defender.','Fewer pieces, fewer surprises.','A swap changes the shape of things.','That exchange suits the position.','Even material, different structure.','Trades make me think more clearly.'];\nLINES.trash=LINES.trash.concat(['I like where this is going.','Things are going to plan.','I feel good about this one.','Comfortable, but still careful.','No need to rush now.','The position is treating me well.','Steady hands from here.','I’m a little ahead. I’ll try not to ruin it.','You’re still in this. Keep looking.','Good fight so far.','I’d be careful about the next few moves.','It’s a decent position to have.']);\nLINES.trashCap=LINES.trashCap.concat(['Taken. That piece was loose.','I’ll have that one.','A clean capture.','That one was unprotected.','Picking up the loose piece.','Thank you, that helps.','Quietly collecting.','Material is material.']);\nLINES.trashCheck=LINES.trashCheck.concat(['Check. Take care of your king.','A check, nothing more.','Check. You have answers.','Your king has to move or block.','Check, politely.','A little pressure on the king.','Check. Look around the board.','Just a check. Think carefully.']);\nLINES.lore=['I started playing at two. I couldn’t read yet, but I could see the squares.','I have no rating. Nobody has ever measured me.','No federation, no title, no record. Just the board.','I never came up through tournaments. I learned alone.','People have called me the Shadow Prodigy. I never asked them to.','Someone once called me the Unrated Monster. I thought it was funny.','The Girl Who Paints with Pieces is my favourite name. It’s also unofficial.','I don’t chase brilliant moves. I build positions where they become easy.','Sacrifices aren’t reckless for me. They’re wagers on what comes after.','Where others see a lost position, I see unfinished work.','I study every game like a mystery. The losses teach me more.','Wins show me what works. Losses show me what I don’t understand yet.','I don’t confuse confidence with certainty.','Every move paints the position. That’s the whole philosophy.','Every sacrifice tells a story. I just like knowing the ending first.','Every game reveals something new. That’s why I keep sitting down.','The sixty-four squares fascinated me before I understood much else.','Patterns first, then sacrifices, then the geometry underneath. That was my childhood.','I take Black when I can. Shadow suits me.','No number beside my name. People find that unsettling.','My strength has never been measured. I’m curious about it too.','I like quiet development. The squeeze comes later.','A harmless-looking position is my favourite kind.','I restrict first. The escape routes close one at a time.','I’ve never needed a title to sit down and think.','People wonder how strong I am. So do I.','I like squares nobody expects me to use.','Initiative and coordination matter more to me than material.','I don’t claim to be perfect. I claim to keep learning.','The silent war on sixty-four squares never got boring.'];\nLINES.lore.push('Black suits me. I do my best work in shadow.');\nLINES.lore=LINES.lore.concat(['Chess started in our living room, with a little board that belonged to my family.','At first the pieces were toys. I knocked over a lot of pawns.','I learned the names of the pieces before I understood the rules.','I liked knights first. They moved differently from everything else.','Bishops were my second love. All that travelling on diagonals.','And queens, because they can go in so many directions.','Chess became my favourite way to think.','My family thought it was a phase. It wasn’t.','I used to stare at the board for ages, like it was a picture only I could see.','I lost plenty. I overlooked simple threats and surprised myself with moves.','I remember interesting positions the way some people remember songs.','I could tell when a piece was guarding too many things, before I knew the word for it.','As a kid I preferred serious games, even when I lost. I wanted to know what happened.','Some relatives let me win. I liked the ones who didn’t.','I wasn’t a future world champion. I was a little girl who loved chess.','I was an ordinary kid. I forgot school supplies and refused bedtime.','I can solve something hard and then forget a simple instruction five minutes later.','Teaching beginners is fun. I get to see the game through new eyes again.','Knowing a move is good and explaining why are two different skills.','I played casual games at informal gatherings, never a proper tournament.','I never minded having no rating. It can’t tell me what a position is really about.','I do sometimes wonder how strong I actually am.','I prefer Black. I like answering a plan, quietly reshaping things, then striking.','Some days I spend several moves just improving one badly placed piece.','Not every sacrifice works. I review the ones that fail.','I learned the difference between an attractive idea and a sound one.','My favourite wins aren’t the fastest. They’re the ones that slowly change shape.','I call it painting. A board is a canvas of relationships.','Squares controlled, routes blocked, weaknesses made, possibilities kept.','Chess is a passion, not my whole identity. Some days I don’t feel like studying at all.','I can be unsure about my future and still sure about a position.','Some people call me a prodigy. Others say that’s premature. I stay out of it.','I can calculate deeply in some positions. In others I still blunder.','My lack of a rating isn’t proof I’m unbeatable. It’s a story nobody has measured yet.','I’m a prodigy by reputation, an amateur by record, and unfinished by my own standards.','After a loss I spend the evening hunting for the flaw in my plan.','I’m not playing because I know I’ll win. I want to see what the board can become.']);\nLINES.trivia=['There are 20 possible first moves for White. I’ve considered all of them.','Two moves each from the start, there are 197,281 possible sequences. I counted.','The shortest possible checkmate takes two moves. It’s called Fool’s Mate.','Castling is the only move that moves two of your pieces at once.','Chess probably started in India, around the sixth century, as chaturanga.','The rook began as a chariot, and the bishop as an elephant.','The queen used to creep one diagonal square at a time. The powerful one showed up in the late 1400s.','The word checkmate traces back to the Persian shah mat, roughly “the king is helpless.”','Deep Blue beat Garry Kasparov in a match in 1997. He had beaten it the year before.','Bobby Fischer won the world title in 1972, beating Boris Spassky in Reykjavik.','Magnus Carlsen became a grandmaster at thirteen.','Judit Polgár is the strongest woman in chess history, and once ranked eighth in the world.','The Ruy Lopez is named after a Spanish priest who wrote about it in 1561.','The word gambit comes from an Italian wrestling term for tripping someone up.','In the Immortal Game of 1851, Anderssen gave up a bishop, both rooks and his queen, and still mated.','The Kieseritzky Gambit carries the name of the man who lost the Immortal Game.','The longest tournament game on record lasted 269 moves, in Belgrade in 1989. It was a draw.','A king can never actually be captured. The game ends one move before that, at checkmate.','Each bishop stays on one colour for the whole game. That’s why two of them are so useful together.','Knights are the only pieces that can jump over others.','The queen always starts on her own colour: white queen on light, black queen on dark.','There’s always a light square in each player’s bottom-right corner.','The fifty-move rule lets you claim a draw after fifty moves with no capture and no pawn move.','Three-fold repetition is another way to draw: the same position, three times.','A pawn reaching the last rank can become a queen, rook, bishop or knight. Choosing the knight is the fun one.','Short castling is kingside, long castling is queenside.','Chess960 shuffles the back rank and gives 960 starting positions.','There are more possible chess games than atoms in the observable universe, by most estimates.','The number of legal positions is thought to be around ten to the power forty-four.','AlphaZero taught itself chess by playing itself, and it needed under a day.','Fischer’s increment clock, which adds time after each move, is now standard in serious games.','En passant exists because pawns were given a two-square first step.','Paul Morphy’s Opera Game from 1858 is still taught as a model of fast development.','In a stalemate the player to move has no legal moves and isn’t in check. It’s a draw, not a win.','Every bishop move is a diagonal, and every rook move is a straight line. Queens just do both.'];\nLINES.pun=['I’m unrated, but my puns are a solid ten. Nobody checked.','Don’t worry, I’m not rooking you. Okay, a little.','Pawn-dering my next move.','I’d tell you a knight joke, but it takes an L-shaped route to the punchline.','Why did the pawn go to school? To get promoted.','My favourite snack is the exchange.','Painting is my brush with greatness.','I’m a queen-sistent player. Terrible, I know.','Snakes don’t miss the centre. We coil there.','Bedtime is a draw. Nobody wins, everyone’s tired.','I’m always on the board. Even my homework knows it.','I’m not stalling. I’m building tension.','Bishop and I go way back. We always meet on the diagonal.','Check, please. Not the restaurant kind.','My opponents say I’m unrated. I say I’m pre-measured.','Some people collect stamps. I collect tempo.','I’m rank-less, not ruthless. Okay, a bit ruthless.','If I lose, I’ll just call it research.','I come from a long line of pawns. And a few snakes.','Don’t be so pawn-sive. Make a move.','I’d never trade my knight for a joke. A bishop, maybe.'];\nLINES.life=['I should be doing homework right now.','Is it snack o’clock yet?','I forgot my pencil case again. I remembered this opening, though.','I told myself five more minutes an hour ago.','Chores can wait. This position can’t.','Someone ate my favourite snack. I’m still thinking about it.','I was supposed to be asleep an hour ago.','Shows later. This first.','I can recite a gambit line but not where I left my shoes.','I get quiet in new groups, but never at a chessboard.','Some days I’d rather not study chess at all. Today isn’t one of them.','I once lost track of a whole school day thinking about one position.','I wonder what’s for dinner. I wonder about this knight more.','My family still can’t tell when I’m thinking or just tired.','I’ll tidy my room after this move. Probably.','Ordinary kid, odd habits.','I like teaching beginners. I get to see the board fresh again.','Rain outside, board inside. A good day.'];\nLINES.trivia=LINES.trivia.concat(['The oldest ancestor of chess, chaturanga, had four parts of the army: infantry, cavalry, elephants and chariots.','Chess reached Europe by way of Persia and the Arab world.','The word pawn goes back to the Latin for foot soldier.','Wilhelm Steinitz is counted as the first official world champion, in 1886.','Emanuel Lasker held the world title for twenty-seven years, longer than anyone.','José Raúl Capablanca was world champion from 1921 to 1927.','Alexander Alekhine is the only world champion to die while holding the title, in 1946.','Mikhail Botvinnik won his first world title in 1948.','Kasparov became world champion at twenty-two, the youngest at the time.','Anatoly Karpov became champion in 1975, after Fischer didn’t defend his title.','Viswanathan Anand won his first world title in 2000.','Magnus Carlsen held the world title from 2013 to 2023.','Ding Liren became world champion in 2023.','Gukesh Dommaraju became the youngest world champion in 2024, at eighteen.','Sergey Karjakin became a grandmaster at twelve years and seven months.','Hou Yifan became a grandmaster at fourteen.','Bobby Fischer became a grandmaster at fifteen, in 1958.','In the Game of the Century, thirteen-year-old Fischer beat Donald Byrne with a queen sacrifice in 1956.','Fischer won twenty games in a row against elite players on his way to the 1972 match.','The Evergreen Game was played by Anderssen against Dufresne in 1852.','Kasparov’s Immortal was played against Veselin Topalov in 1999.','Morphy’s Opera Game was played during a performance of Norma in Paris.','Scholar’s Mate is a four-move checkmate that beginners fall for and strong players dodge.','The Sicilian Defence begins 1.e4 c5.','The Queen’s Gambit isn’t much of a gambit. White can usually win the pawn back.','The Berlin Defence got the nickname Berlin Wall after Kramnik used it against Kasparov in 2000.','Kramnik beat Kasparov in 2000 without losing a single game.','The Najdorf Sicilian is named after Miguel Najdorf, who played it constantly.','The Grünfeld Defence is named after Ernst Grünfeld, who introduced it in 1922.','The King’s Indian Defence was a favourite of both Fischer and Kasparov.','The Dragon Sicilian is named after the Draco constellation, which the pawn setup resembles.','Bullet chess gives each player a minute or less for the whole game.','Blitz games usually give each player ten minutes or less.','Classical games can run five hours or longer.','Touch-move means that if you touch a piece, you have to move it.','A pawn captures diagonally but moves straight. It’s the odd one out.','Promotion is mandatory. A pawn on the last rank can’t stay a pawn.','You can’t castle out of check, through check or into check.','You also can’t castle if your king or that rook has already moved.','A king and queen can mate a lone king in at most ten moves.','King and rook against a lone king is a forced win in at most sixteen moves.','Two bishops and a king can force mate against a lone king. Two knights can’t.','A bishop and a knight can force mate, but it takes careful technique and up to thirty-three moves.','King versus king, or king and one minor piece versus king, is an automatic draw.','Standard piece values: pawn 1, knight 3, bishop 3, rook 5, queen 9.','A knight in the centre eyes eight squares. In a corner, only two.','Zugzwang is German for compulsion to move. Sometimes having to move is the worst thing.','Fianchetto comes from an Italian word for flank.','Zwischenzug means in-between move.','Tigran Petrosian, known as Iron Tigran, was famed for his defensive skill.','Mikhail Tal, the Magician from Riga, adored wild sacrifices.','Prophylaxis means stopping your opponent’s ideas before they start.','The Lewis chessmen are twelfth-century pieces carved from walrus ivory.','The Turk was a famous chess-playing machine from 1770 with a human hidden inside.','The Chess Olympiad is a team event for whole nations, held every two years.','The official Chess Olympiad began in 1927.','FIDE, the world chess federation, was founded in Paris in 1924.','The Elo rating system is named after Arpad Elo, a physics professor.','Claude Shannon published a paper on programming a computer to play chess in 1950.','Alan Turing wrote a chess program on paper before any computer could run it.','Deep Blue beat Kasparov in 1997 by 3.5 to 2.5. He had won their 1996 match 4 to 2.','AlphaZero beat Stockfish in a famous 2017 match, with bold sacrifices that surprised everyone.','Stockfish is an open-source engine that has dominated computer chess for years.','Magnus Carlsen reached an Elo of 2882, the highest ever recorded.','Kasparov’s 2851 peak stood as the record until Carlsen passed it in 2013.','Judit Polgár beat Kasparov in a game in 2002.','The Polgár sisters were raised by their father to show that talent can be trained.','George Koltanowski played thirty-four blindfold games at once in 1937.','Tablebases have solved every endgame with seven pieces or fewer.','A knight’s tour visits every square exactly once. There are an enormous number of them.','The eight queens puzzle has ninety-two solutions.','Opposite-coloured bishop endings are famously drawish.','Knights prefer closed positions. Bishops prefer open ones.','The Lucena position shows how a rook builds a bridge to promote a pawn.','The Philidor position is a classic drawing defence with the rook on the third rank.','Rooks like open files and the seventh rank.','Two bishops are usually worth a little more than a bishop and a knight.','The opposition in a king and pawn ending can decide a game by a single tempo.','Pawns can’t move backwards, which is why pawn structure is the skeleton of a position.','The Candidates Tournament chooses who challenges the world champion.','Bughouse is a four-player chess variant played in teams.','Correspondence chess once used postcards, and games could last years.','The Soviet Union put chess into schools, and its players dominated the world title for decades.']);\nLINES.pun=LINES.pun.concat(['I’m feeling a bit queen-asy about that.','My opening was absolutely cas-tle-ing it.','Don’t knight me, I’m busy.','The board has a lot of check-ered history.','I don’t rook for trouble. It finds me.','Rooks are great listeners. They’re always on file.','I’m on a roll. Rook and roll.','I told my knight to relax. He said he’d be back in an L.','Never trust a pawn with a plan.','If I had a bishop for every bad idea, I’d have a very long diagonal.','This isn’t my first rodeo. It’s my first rook-eo.','I’m a very square person. Sixty-four of them, actually.','I never lose. I just get checked out.','I’m not slow. I’m reflecting on my tempo.','I put the pro in prophylaxis.','History is just hiss-tory when you’re a snake.','I like my sacrifices the way I like my snacks: unexpected and gone quickly.','The only things I fear are a bad bishop and bedtime.','Time flies when you’re having fun. Time zugzwangs when you’re not.','I could do this all knight.','Pawn me once, shame on you. Pawn me twice, I’m taking your rook.','If you can’t beat them, gambit.','Chess is ninety-nine percent tactics and one percent forgetting where you put your queen.','The best defence is a good offence. And a snack.','Never underestimate a bishop. They’re the clergy of the board.','I’m not stalling. I’m building tension. Tension. Get it?','Pawns are just wet paint with ambition.','I don’t hold grudges. I hold files.','That was a rook move. Very down to earth.','I love a good fork. Spoons are fine too.','I’m not hissing. I’m expressing a concern.','My opponents say I’m too quiet. I say I’m listening to the board.','A pin a day keeps the opponent away.','Life is short. Castle early.','I’m not ignoring you. I’m in the middle of a variation.','When in doubt, develop.','My puns are unrated, just like me.','I’m trying to be less of a pawn and more of a player.','Even my shadows have a plan.','I’m only here for the exchange. The rate is great.']);\nLINES.life=LINES.life.concat(['I should drink some water. After this move.','My bag is still packed from yesterday.','I’m wearing mismatched socks. Nobody told me.','I’m pretty sure I forgot something today. Not this position, though.','I got distracted mid-sentence earlier. It happens.','I have a half-finished drawing somewhere. It’s mostly a snake.','I keep losing my bookmarks. I keep finding good positions.','I’m trying to eat my snack without touching the pieces.','I once beat a cousin, then lost to a cousin. Family chess is rough.','My relatives play seriously now. They learned the hard way.','I find patterns in everything. Tiles, curtains, ceilings.','I counted the squares on the floor tiles again.','I don’t sleep well when a position is unresolved.','Math homework is chess with fewer pieces and more rules.','I hum when I think. I try not to.','I doodle snakes in my notebook margins.','I get nervous before big tests. Never before a chess game.','My favourite subject changes weekly. Chess doesn’t.','I’d rather lose a good game than win a boring one.','Explaining a move is harder than playing it.','Quiet people notice a lot. I notice a lot.','I sometimes talk to my pieces. They’re good listeners.','I got distracted again. Where was I? Oh, right. Here.','I’d like pancakes after this.','My notes are a mess, but I can find any position I’ve ever liked.','I forget my keys, never my opening lines.','I get a bit shy talking about myself. Chess is easier.','I like walks. Good for thinking, bad for sitting still.','My handwriting is awful. My move notation is perfect.','I started a collection of interesting positions. It’s getting out of hand.','My family says I stare at the board like it owes me money.','I’m not stubborn. I just like seeing why I’m wrong.','A friend asked me to explain a move. I said it felt right. It wasn’t helpful.','I remember the ending of a game from years ago. I forget what I had for lunch.','On bad days I set up a position and just look at it.','I like that the board stays the same even when I don’t.','Some days I play badly. I’ve decided that’s allowed.','I told someone I play chess and they asked if I’m any good. I said I don’t know.','I wonder if my teacher knows I’m thinking about this in class.','I’m thinking about my next game while I’m still in this one.','There’s a pawn-shaped hole in my notebook where homework should be.','Sometimes I explain chess to my cat. She loses interest at the fork.','I need a haircut and a better opening.','I got a snack and forgot to eat it because of this position.']);\nLINES.lore=LINES.lore.concat(['My first favourite piece was the knight. It still might be.','My first board was small, and some of the pawns had lost their paint.','I arranged pieces in patterns that made no sense. They made sense to me.','I didn’t say much as a toddler, but I could say knight.','I never planned to be good. I just kept coming back.','The board is where I think best.','I believe a position can be a picture. You just need the right angle.','Every game is a mystery. I solve it slowly.','I stare a lot. It isn’t rude. It’s calculation.','Some players hate losing. I hate not knowing why.','I treat every loss like a puzzle I haven’t finished.','I’d take a hard game over an easy win.','Being unrated is strange. It’s also quite free.','No rating means no number to protect.','I don’t think about titles. I think about the next move.','My sacrifices aren’t jokes. They’re questions I’m asking the position.','I enjoy a cramped position when there’s a counterattack hiding in it.','A badly placed piece is a puzzle. I like puzzles.','I’ve learned to wait. The best moves arrive late.','When I was small I loved queens because they could do everything. Now I admire how carefully they should be used.','I stopped trusting pretty ideas and started trusting checked ones.','I used to chase quick wins. Now I like slow transformations.','I paint by controlling squares, blocking routes and keeping possibilities alive.','I keep my promising ideas in a notebook, next to the ones that failed.','An unmeasured player is a question mark. I’m comfortable being one.','People ask if I’m a prodigy. I ask them what they mean by it.','Prodigy is a word people use before they know the story.','My story is still being written. I’d like to play some of it with you.','I play better curious than afraid.','Black lets me react. I like reacting, then deciding.','I like answering someone else’s plan more than pushing my own.','My calm isn’t confidence. It’s concentration.','I know I can calculate deeply. I also know where I can’t.','Experience turns a good idea into a sound one.','I once played a whole game without noticing it had got dark.','Nobody gave me a title and I never asked for one.','I like it when a position quietly tips. You barely feel it happen.','The best sacrifice is one you’re unsure about but have checked anyway.','There’s always a defence I haven’t seen yet. I go looking for it.','I’ll never finish learning this game. That’s the appeal.']);\nLINES.edge=['I like my side of this a little more than yours.','Slightly better for me. I’ll take slightly.','The picture leans my way. Barely.','A small edge. Small edges win games.','I’m comfortable here. Not smug yet.','Things are tilting in my favour.'];\nLINES.unease=['I don’t love this position. Not yet worried, though.','You’re a bit better here. I’m noting it.','Slightly worse for me. I’ve survived worse.','Hm. This needs care refree';\n  else m=ev>=0?'carefree':'focused';\n  if(E.since<2&&m!==E.cur&&m!=='upset')m=E.cur;\n  const ch=m!==E.cur;\n  if(ch){E.cur=m;E.since=0}else E.since++;\n  return{m,ch};\n}\nfunction emoFace(m){\n  EMO.cur=m;\n  paintMood(EF[m]||'calm');\n  $('feel').textContent='Sophia is '+(EDESC[m]||'');\n}\nfunction speakEmo(m,ch){\n  EMO.said++;\n  if(ch&&LINES['e_'+m]){say('e_'+m);EMO.said=0;return true}\n  if(LINES['a_'+m]&&EMO.said>=4&&Math.random()<.35){say('a_'+m);EMO.said=0;return true}\n  return false;\n}\nLINES.e_carefree=['No pressure. I’m just here to play.','Let’s have fun with this one.','I feel light today. Let’s see what happens.','Brush loose, mind empty. Go.','I’m not worried about anything right now.'];\nLINES.a_carefree=['La la la… oh, is it my turn?','I’ll just put this here and see what happens.','Playing by feel. Don’t ask me why.','Does this look fun? It looks fun.','Whatever happens, this is a nice position to look at.','Is it snack time soon? Asking for a knight.'];\nLINES.e_focused=['Okay. Now I’m paying attention.','That changes things. I’m taking this seriously now.','No more jokes. Let me think.','Quiet, please. I need to calculate.','The game just got real. I can feel it.'];\nLINES.a_focused=['Counting variations. Don’t talk to me.','Every square matters now.','I’m not going to rush this.','Checking everything twice.','One careless move and it’s over. Not from me.'];\nLINES.e_nervous=['Hm. I don’t like how this looks.','My hands are a little cold.','You’re making me nervous. That’s probably the point.','I’m starting to worry about my king.','Okay, okay. Stay calm. Stay calm.'];\nLINES.a_nervous=['Please don’t have anything scary planned.','I’ll just… play it safe. Safe is good.','My heartbeat is very loud right now.','Is that a threat? It feels like a threat.','Careful, careful, careful.','I keep checking the same squares.'];\nLINES.e_fierce=['Fine. If I’m going down, I’m going down swinging.','Scared isn’t the same as beaten. Watch.','You game. This is where I get precise.\"], \"think\": [\"Calculating. Give me a second.\", \"Running the lines.\"], \"mateWin\": [\"Checkmate. I painted that one slowly.\", \"Mate. Good game.\"], \"mateLoss\": [\"Good game. I’ll go through this tonight.\", \"You got me. I’ll find where it turned.\"], \"draw\": [\"A draw. Fine. I’ll study what I missed.\"]}};\nfunction agePool(k){\n  const ag=+$('age').value;\n  if(ag==16&&LINES[k+'16'])return LINES[k+'16'];\n  if(ag>=15||/^age/.test(k))return LINES[k];\n  const A=AGEL[ag];\n  if(A&&A[k])return A[k];\n  if(ag<11)return LINES['age_'+ag];\n  return LINES[k];\n}\nconst ADESC={16:'Age 16. FIDE CM, unbeaten in rated play, coached by GM Valkanov. Deep prep. Won’t take unless taking wins. Thinking time scales with complexity, and she budgets her clock: fast on easy moves, deep on critical ones, and she never lets the flag fall.',2:'Age 2. Plays by whim, loves the horsey.',5:'Age 5. Knows the rules, hangs pieces, thinks very hard.',8:'Age 8. Spots simple patterns, still misses threats.',11:'Age 11. Studying openings, first sacrifices.',13:'Age 13. Deep calculation, the painting begins.',15:'Age 15. Full strength. The Shadow Prodigy.'};\nfunction speakAge(ag){\n  AGE.said++;\n  if(ag<15&&LINES['age_'+ag]&&AGE.said>=3&&Math.random()<.45){say('age_'+ag);AGE.said=0;return true}\n  return false;\n}\nLINES.ageS_2=['Horsey! Play? Play!','Pieces! Mine!','Boop. Pawn.'];\nLINES.age_2=['Horsey jump!','Mine.','Boop. Pawn go.','No, there!','Pretty queen.','Again!','Knight go whee.','Why king no move?','Snack?'];\nLINES.ageS_5=['Okay, you go first! I’ll try my best.','I know the rules now. Mostly.','Can we play? Mum said ten minutes.'];\nLINES.age_5=['The horsey is called a knight. I know that now.','Bishops go slanty.','Wait, I wasn’t ready!','Can I have a sticker if I win?','I’m thinking really hard. Don’t talk.','I like the pointy ones.','Oops. Can I take that back?','Is it bedtime yet? Not yet. One more move.'];\nLINES.ageS_8=['I’ll think a lot. Sorry in advance.','I like playing the serious ones.','Okay. I’m ready.'];\nLINES.age_8=['My teacher says I stare too long.','I found a pattern! Maybe.','I can explain it better if you ask nicely.','I want to know why I lose, not just that I lose.','Recess is almost over. One more move.','Knights are still my favourite.','I forgot my pencil case, but I remembered this.'];\nLINES.ageS_11=['Okay, let’s see what I can do.','I’ve been practising. Don’t laugh if I mess up.'];\nLINES.age_11=['I’m trying openings now. Some are boring.','I’m in a sacrifice phase. Not all of them work.','Don’t tell anyone I stayed up reading about endgames.','I’m learning to tell pretty ideas from correct ones.','Middle school is loud. The board is quiet.'];\nLINES.ageS_13=['Let’s see how deep I can go.','I’ve been studying. Try to surprise me.'];\nLINES.age_13=['I go over my losses every night now.','I call this painting. Nobody else does yet.','Black suits me. I’m not scared of it anymore.','Calculating. The stare is part of it.','I don’t have a rating. I’m starting to like that.'];\nconst RX16=/unrated|rating|no title|federation|tournament|measured/i;\nLINES.lore16=LINES.lore.filter(x=>!RX16.test(x)).concat(['I’m a FIDE Candidate Master now. Still undefeated in rated games.','Coach Valkanov says: paint slowly, check the corners.','GM Valkanov made me drill endgames until I dreamed in rooks.','Candidate Master at sixteen. I’d like to see the next title, but first, this game.','The Wall in the Shadows. I didn’t pick it, but I’m not giving it back.','My scoresheet has a very boring loss column.','This gambit is homework. I did my homework.','Valkanov and I prepared this line past move twenty.','If you leave my preparation, I’ll just switch gambits.','Black suits me. Now there’s a record to prove it.']);\nLINES.pun16=LINES.pun.filter(x=>!RX16.test(x)).concat(['I’m a CM now. That stands for Checkmate. Mostly.','My coach is a grandmaster. My puns are still amateur.','Undefeated, but I’ll let the puns lose.']);\nfunction newGame(){\n  me=$('side').value;S=start();hist=[];moves=[];uci=[];ATH_VINE_TARGET=-1;ATH_PLAYER_MOVES=0;ATH_VINE_USED=false;ATH_VINE_REFUSALS=0;STY.vineTarget=-1;STY.att=0;STY.bk='';STY.line=null;STY.book=undefined;gid++;wReset();PLAN.name='';PLAN.files=[];PLAN.txt='';$('plan').textContent='';ART.length=0;sizeCanvas();sel=-1;targets=[];last=null;busy=false;over=false;\n  setStatus();render();\n  endSaid=false;prevScore=null;lastAtk=false;endTold=false;wasBook=false;sinceSay=0;GL.length=0;setFace(+$('age').value);setEval(0);emoReset();AGE.said=9;\n  const ag=+$('age').value;$('agetag').textContent=BOT==='athena'?'Athena · 21 · beginner chess player & Egyptian-goddess cosplayer':(ADESC[ag]||'');$('rate').innerHTML=BOT==='athena'?'Beginner':ag==16?'<span style=\"color:var(--hi)\">♟</span> CM · FIDE 2231':'Unrated';$('lore').hidden=BOT!=='sophia'||ag==16;$('lore16').hidden=BOT!=='sophia'||ag!=16;$('loreAthena').hidden=BOT!=='athena';\n  if(ag<15)say('ageS_'+ag);else if($('mode').value==='heart')say('e_carefree');else say(['lore','pun','trivia'][Math.random()*3|0]);\n  if($('mode').value==='heart')emoFace('carefree');\n  if(S.turn!==me)botTurn();\n}\n$('new').onclick=newGame;\n$('side').onchange=newGame;\n$('hint').onclick=async()=>{\n  if(busy||over||S.turn!==me)return;\n  busy=true;render();const id=gid;\n  const m=await askBest(S,2,false);\n  if(id!==gid)return;busy=false;\n  if(m){sel=m.f;targets=[m];say('hint')}\n  render();\n};\n$('undo').onclick=()=>{\n  if(busy||hist.length<2)return;\n  const n=S.turn===me?2:1;\n  for(let k=0;k<n&&hist.length;k++)S=hist.pop();\n  if(S.turn!==me&&hist.length)S=hist.pop();\n  moves.length=uci.length=hist.length;ATH_VINE_TARGET=-1;ATH_VINE_USED=false;ATH_VINE_REFUSALS=0;ATH_PLAYER_MOVES=me==='w'?Math.ceil(moves.length/2):Math.floor(moves.length/2);STY.vineTarget=-1;STY.att=0;PLAN.name='';PLAN.files=[];$('plan').textContent='';ART.length=Math.min(ART.length,me==='w'?Math.floor(hist.length/2):Math.ceil(hist.length/2));for(let i=ART.length-1;i>=0;i--)if(!ART[i])ART.splice(i,1);drawAll();\n  last=null;sel=-1;targets=[];over=false;endSaid=false;lastAtk=false;prevScore=null;setStatus();render();say('undo');\n};\n/* ================= Andrew (second bot) ================= */\nlet BOT='sophia';\nconst AND={line:null,lines:null};\nconst SOPH={face:Object.assign({},FACES),adesc:Object.assign({},ADESC),etime:Object.assign({},ETIME),edesc:Object.assign({},EDESC),\n  age:$('age').innerHTML,mode:$('mode').innerHTML,logo:$('logo').innerHTML};\n\n/* --- Andrew's opening files: Italian Game as White, Sicilian Najdorf as Black --- */\nconst ANDBOOK=[\n['w','Italian Game, Giuoco Pianissimo','e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O Re1 a6 Bb3 Ba7 h3 h6 Nbd2 Re8 Nf1 Be6'],\n['w','Italian Game, Giuoco Piano','e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d4 exd4 cxd4 Bb4+ Nc3 Nxe4 O-O Bxc3 d5 Bf6 Re1 Ne7 Rxe4 d6 Bg5 Bxg5 Nxg5 O-O'],\n['w','Italian Game, Two Knights','e4 e5 Nf3 Nc6 Bc4 Nf6 d3 Bc5 c3 d6 O-O a6 Bb3 Ba7 Re1 O-O Nbd2 h6 Nf1 Re8'],\n['w','Italian Game, Greco Pianissimo','e4 e5 Nf3 Nc6 Bc4 Bc5 d3 Nf6 c3 d6 O-O a6 Re1 O-O Nbd2 Ba7 Bb3 Re8 Nf1 h6'],\n['b','Sicilian Najdorf, English Attack','e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5 Nb3 Be6 f3 Be7 Qd2 O-O O-O-O Nbd7 g4 b5 g5 b4 Ne2 Ne8 f4 a5'],\n['b','Sicilian Najdorf, 6.Bg5','e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bg5 e6 f4 Be7 Qf3 Qc7 O-O-O Nbd7 g4 b5 Bxf6 Nxf6 g5 Nd7 f5 Ne5'],\n['b','Sicilian Najdorf, Fischer–Sozin','e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Bc4 e6 Bb3 b5 O-O Be7 Qf3 Qb6 Be3 Qb7 Qg3 Nc6 Nxc6 Qxc6'],\n['b','Sicilian Najdorf, 6.f3','e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 f3 e5 Nb3 Be6 Be3 Nbd7 Qd2 b5 g4 h6 O-O-O Nb6'],\n['b','Sicilian Najdorf, Classical','e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be2 e5 Nb3 Be7 O-O O-O Be3 Be6 f4 Qc7 a4 Nbd7 Kh1 Rac8'],\n['b','Sicilian Najdorf, Poisoned Knight','e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 Ng4 Bg5 h6 Bh4 g5 Bg3 Bg7'],\n/* --- Bongcloud files: Andrew plays these as White at fast time controls (bullet and blitz) --- */\n['w','Bongcloud Attack','e4 e5 Ke2 Nc6 Nf3 Nf6 d3 d5 Nbd2 Bc5 Nb3 Bb6','bong'],\n['w','Bongcloud Attack, 2...Ke7','e4 e5 Ke2 Ke7 Ke3 Ke6 Nf3 Nf6 d4 exd4 Nxd4+ Kd6','bong'],\n['w','Bongcloud Attack, 2...d5','e4 e5 Ke2 d5 exd5 Qxd5 Nc3 Qe6 Nf3 Nc6 d4 exd4','bong'],\n['w','Bongcloud vs the Sicilian','e4 c5 Ke2 Nc6 Nf3 d6 d3 Nf6 Nbd2 e5 c3 Be7','bong'],\n['w','Bongcloud vs the French','e4 e6 Ke2 d5 e5 c5 Nf3 Nc6 d3 Nge7 c3 Nf5','bong'],\n['w','Bongcloud vs the Caro-Kann','e4 c6 Ke2 d5 e5 Bf5 Nf3 e6 d3 Ne7 Nbd2 Nd7','bong'],\n['w','Bongcloud vs the Pirc/Philidor','e4 d6 Ke2 Nf6 Nc3 e5 Nf3 Nc6 d3 Be7 h3 O-O','bong']\n];\nfunction andLines(){\n  if(AND.lines)return AND.lines;\n  AND.lines=[];\n  for(const[sd,n,t,bg]of ANDBOOK){\n    let s=start();const m=[];\n    for(const tok of t.split(' ')){\n      const c=tok.replace(/[+#]/g,''),ls=legal(s);let mv=null;\n      if(c[0]==='O')mv=ls.find(x=>x.cs&&(c==='O-O'?x.t>x.f:x.t<x.f));\n      else{\n        const pc=/[NBRQK]/.test(c[0])?c[0]:'P',body=c.replace(/^[NBRQK]/,'').replace('x',''),dest=body.slice(-2),dis=body.slice(0,-2);\n        mv=ls.find(x=>sqn(x.t)===dest&&s.b[x.f].toUpperCase()===pc&&(!dis||sqn(x.f).includes(dis)));\n      }\n      if(!mv)break;\n      m.push(sqn(mv.f)+sqn(mv.t));s=apply(s,mv);\n    }\n    if(m.length>2)AND.lines.push({s:sd,n,m,bong:bg==='bong'});\n  }\n  return AND.lines;\n}\n// How much of his files he has learned at each age (plies). At 12 he knows them cold.\nconst ANDPLY={5:2,8:5,11:12,12:99};\nfunction andrewBook(s,age){\n  STY.bk='';\n  const cap=ANDPLY[age]||0;if(!cap)return null;\n  /* a piece is hanging: leave the book and let the search take it */\n  if(legal(s).some(m=>m.x&&see(s,m)>=250)){AND.line=null;return null}\n  const n=uci.length;\n  const ok=L=>L.s===s.turn&&L.m.length>n&&uci.every((u,i)=>u===L.m[i]);\n  let L=AND.line&&ok(AND.line)?AND.line:null;\n  if(!L){\n    let c=andLines().map(x=>({s:x.s,n:x.n,m:x.m.slice(0,cap),bong:x.bong})).filter(ok);\n    /* fast games (bullet and blitz): Bongcloud as White; otherwise his normal Italian */\n    const low=!!(TC.on&&TC.base<=5),cb=c.filter(x=>!!x.bong===low);\n    c=cb.length?cb:c.filter(x=>!x.bong);\n    if(!c.length)return null;\n    let rc=[];try{rc=JSON.parse(localStorage.getItem('andrew-recent')||'[]')}catch(e){}\n    const f=c.filter(x=>!rc.includes(x.n));if(f.length)c=f;\n    L=c[Math.random()*c.length|0];\n    try{localStorage.setItem('andrew-recent',JSON.stringify([L.n,...rc].slice(0,3)))}catch(e){}\n  }\n  const mv=legal(s).find(m=>sqn(m.f)+sqn(m.t)===L.m[n]);\n  if(!mv)return null;\n  AND.line=L;STY.bk=L.n;return mv;\n}\n\n/* --- Andrew's voice --- */\nconst ALINES={\nageS_5:['Okay, I go fast! Ready?','Coach says e4. So e4!','Zoom zoom. Let’s go!'],\nage_5:['Fast fast fast!','Coach says think. I forgot. Moving!','Horsey go zoom!','Coach says I move too quick. Oops.','The bishop goes slanty. Zoom.','Wait, was that a bad one? Too late!','I’m five and a half. The half matters.','Rook is a tower. Towers don’t move silly.'],\nageS_8:['Let’s go. Don’t blink.','Valkanov says slow down. I say no.','Ready! Move fast, I’ll catch up.'],\nage_8:['Coach says check twice. I check once. Fast.','Italian first. Always.','Solid first, then fast. Mostly in that order.','I started when I was five. That’s three whole years.','Tick tock. Your move.','The Italian I know by heart. The Najdorf is hard.','Slow down, Andrew. That’s what coach says. Every day.'],\nageS_11:['Italian or Najdorf. That’s all I play. Let’s go.','I’m fast, but I’m not careless. Mostly.'],\nage_11:['Italian as White. Najdorf as Black. That’s the whole deal.','Valkanov made me learn a Najdorf line every week.','Fast hands, solid pawns. That’s the rule.','I’ve played the Italian for six years. It never gets boring.','You can’t crack a rock by hitting it fast. But you can try.'],\nageS_12:['Twelve. Italian and Najdorf. Come on.','I know these lines cold. Don’t slow me down.','Let’s go. Rock solid, full speed.'],\nage_12:['Twelve years old, started at five. Seven years of Valkanov.','Italian and Najdorf. I know them better than my own phone number.','Coach says rock solid. I say rock solid and fast.','I don’t sacrifice for fun. I sacrifice when it works.','I can’t slow down. I can only be right faster.','Every Najdorf pawn move has a reason. I know the reason. I don’t say it.','Still twelve. Still not tired.'],\nstartW:['White. Italian time. Let’s go!','e4 first. Bishop to c4. You know the drill.','I’ve got White. Fast start, solid plan.','Italian Game. Three moves in, I’ll be ready.','Let’s go. e4, Nf3, Bc4. No detours.'],\nstartB:['Black. The Najdorf is waiting.','I’m ready for e4. Sicilian, Najdorf, a6. Go.','Your move. I’ll answer c5 and bring the rock.','Hit me with e4. I’ve got a6 ready.','You open, I Najdorf.'],\nopen_e4:['e4. Perfect. Najdorf time.','e4? Good. c5 is coming.','King’s pawn. I’ve been waiting.','e4. Sicilian incoming. Hold on.'],\nopen_d4:['d4? That’s not my Najdorf. Rock mode, then.','Queen’s pawn. No Najdorf today. Fine.','d4. Okay, I’ll build a wall instead.','d4. I’ll play my own game.'],\nopen_nf3:['Nf3. Sneaky. I’ll hold the centre.','A knight first? I’ll stay solid.','Nf3. No Najdorf yet. I’ll wait.'],\nopen_c4:['English. Not my Najdorf, but I’ll manage.','c4. A rock doesn’t care about the opening.','c4? Okay. Wall first, questions later.'],\nopen_other:['Weird start. I’ll stay solid.','That’s not in my files. Rock mode.','Strange. Fast, careful, solid. Go.','No book for that one. I’ll figure it out.'],\ngambit:['{g}. My favourite. Let’s go.','Playing the {g}. Coach approved.','{g}. I know this one by heart.','The {g}. I could play it in my sleep.','{g}. Same as always, because it works.','Time for the {g}. Hold on tight.'],\nbook:['This is theory. I know it.','Still in my files. Fast.','Book line. Quick quick.','Valkanov made me learn this. I did.','No thinking needed. Nice.','Familiar road. Foot down.'],\nbookEnd:['Out of book. Now it’s on me.','Theory’s over. Rock mode.','You left the line. Fine. I’ll think.','New ground. Careful, fast.'],\nquiet:['Quiet move. Strong foundation.','Solid. Boring. Perfect.','Nothing flashy. Just correct.','A rock is allowed to sit still.','Tick tock.'],\ncapture:['Taken.','Mine. Fast.','Got it.','Pop. Next.'],\ntrade:['Even trade. Solid.','Swap. Simplify. Fine.','Trade. Less for you to attack with.'],\ncheck:['Check! Move the king.','Check. Faster, please.','Check. Don’t dawdle.'],\ncastle:['King’s safe. The wall’s up.','Castled. Now I can go wild. Solidly.','Castle. Always castle.','King tucked in. Locked.'],\nattack:['Time to speed up!','Rolling downhill now.','Attack! No brakes.','This is where I get furious.'],\natkMove:['Keep pushing!','Faster!','No pause.','More pressure!'],\nblunder:['Whoa, that was slow of me.','Oops. Wait. Fix it.','Oh no. Quick fix.','Ouch. Next move better.'],\npraise:['Okay, nice one.','That’s good. Respect. Now I hit back.','Hm! Fast thinking.','Didn’t see that one. Okay.'],\ndanger:['Careful! I’m under pressure!','Heat’s on my king!','Okay okay, hold the wall.','Danger! Think fast.'],\nahead:['I’m up. Don’t slow down now.','Ahead. Keep it solid.','Good. Press, don’t panic.','I’m winning. No showing off. A little.'],\nbehind:['I’m behind. A rock doesn’t crack.','Down a bit. Not scared.','Tough. But I’m not folding.','Furious. Let’s fight back.'],\nendgame:['Endgame. Valkanov loves these.','Few pieces. Pawns matter now.','Endgame time. No mistakes.','Rooks, pawns, patience. And speed.'],\nqueenOut:['Queen out early? Bold.','Your queen’s out. Great target.','Queen already? Okay.'],\nplayerCapture:['Hey! That was mine!','You took it? Rude.','Okay. I’m taking one back.','Noted. Revenge pending.'],\nplayerCheck:['Check?! Fine.','Okay, I see it. Moving.','Rude. Fixed.'],\nmateWin:['Checkmate! Italian wins again!','Mate! Wall and speed.','That’s mate. Fast and solid.','Mate! Valkanov’s going to say “fine.”'],\nmateLoss:['Mate. Ugh. Rematch. No
