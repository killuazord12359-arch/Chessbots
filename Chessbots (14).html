! Check! Hold on!','Eep! Okay, okay.','You checked me! Rude!','Check?! My heart!','Okay, breathe. Breathe.'],blunder:['Wait, is that really free?','Oh, that’s a gift! Thank you!','I hope this isn’t a trap.','Is it a trick? It looks like a trick.','I’m not sure, but I’m taking it!'],praise:['Wow, that’s amazing!','Okay, I love that move!','How do you find these?','That was so clever!','I’m going to remember that one.'],mateWin:['I did it! I actually did it!','Checkmate! Oh my gosh!','I won! Somebody take a photo!','Checkmate! The hippo wins!','Good game! That was amazing!'],mateLoss:['Aww, you got me!','I’ll practise and be back!','Great game! I learned a lot.','Rematch? Please?','Oh no. But that was fun!'],quiet:['Just building my hippo.','A quiet move. I hope it’s fine.','Slowly, slowly.','I’m keeping it solid.','Hippo pawns, look at them go.'],think:['Hold on, I’m thinking!','Hmm, what should I do?','Give me a second!','Is this safe? Let me check.','Wait, wait, wait.'],trash:['Wow, I’m actually doing well!','I think this is good for me!','This is going great!','I can’t stop smiling!','Is it okay to feel this proud?'],behind:['Oh no, I’m behind.','This isn’t going well.','I need a miracle.','I’m losing pieces. Eek.','Let me think of something.'],castle:['King to safety!','Castling! I love that move.','Tucking the king in!','There, much better.','King and rook switch! Magic.'],draw:['A draw? That’s okay!','Nobody wins. Weird.','We tied! I’m kind of proud.','A draw feels like a win for me.','Well, we’re even.']}};\nfor(const k in X.sophia){(LINES[k]=LINES[k]||[]).push(...X.sophia[k]);if(LINES[k+'16'])LINES[k+'16'].push(...X.sophia[k])}\nfor(const k in X.andrew){(ALINES[k]=ALINES[k]||[]).push(...X.andrew[k])}\nfor(const k in X.athena){(ATHENA_DIALOGUE[k]=ATHENA_DIALOGUE[k]||[]).push(...X.athena[k])}\n})();\n\n/* ===== Ask-me-anything: 20 topics x 10 phrasings = 200 questions per bot, 10 answers each ===== */\nconst QA_Q={\nwho:['What’s your name?','Who are you?','Can you introduce yourself?','So who am I playing against?','Tell me a bit about yourself.','What should I call you?','Who are you really?','Are you a real person?','What’s your story?','Why are you here?'],\nage:['How old are you?','What’s your age?','Are you young or old?','When’s your birthday?','Wait, how old are you again?','Are you a kid?','Are you older than me?','Do you feel your age?','Age is just a number, right?','Are you grown up yet?'],\npiece:['What’s your favorite piece?','Which piece do you like best?','Do you have a favorite piece?','Knights or bishops?','Which piece is the most underrated?','Which piece do you hate?','What’s the best piece in chess?','Do you love your queen?','Rooks or bishops, pick one.','Which piece is the prettiest?'],\nopening:['What’s your favorite opening?','What opening do you like to play?','Why did you open like that?','Do you play the same opening every game?','What’s your go-to move?','Any opening you never play?','What opening should I learn?','Is that your signature opening?','How do you start a game?','Do you plan your opening ahead?'],\nfeeling:['How are you feeling?','How’s it going?','Are you okay?','How’s your day been?','Are you having fun?','What’s your mood right now?','You doing alright?','Are you enjoying this game?','Be honest, how are you feeling?','Do you feel good about this game?'],\ngame:['Who’s winning?','How do you think the game is going?','Are you ahead?','Do you think you’re winning?','Am I doing okay?','What’s your evaluation?','Is the game close?','Who’s better right now?','Should I be worried?','Where is this game headed?'],\nfood:['What’s your favorite food?','What did you eat today?','Do you like pizza?','What’s your favorite snack?','Are you hungry?','What’s your favorite dessert?','Do you cook?','Coffee or tea?','What’s your favorite drink?','What would you eat after this game?'],\nhobby:['What do you do for fun?','What are your hobbies?','What do you do besides chess?','Do you have any hobbies?','What do you do on weekends?','What’s your favorite thing to do?','Do you play other games?','How do you relax?','What else are you into?','Do you watch anything?'],\ncolor:['What’s your favorite color?','Which color do you like best?','What color are your pieces in your dreams?','Do you like black or white?','What color is your mood?','Favorite color, go.','What color do you wear most?','Which color suits you?','Pink or blue?','What’s the prettiest color?'],\nadvice:['Any tips for me?','How can I get better at chess?','What should I practice?','Give me some advice.','What’s your best chess tip?','What am I doing wrong?','How do I stop blundering?','What’s the secret to winning?','Should I study openings or endgames?','What do beginners get wrong?'],\nnerves:['Are you nervous?','Are you scared?','Do you get nervous during games?','Do you ever panic?','Are you afraid of losing?','Does pressure bother you?','How do you stay calm?','Are your hands shaking?','Do you ever choke?','Do you get stage fright?'],\nschool:['What’s your day like?','Do you go to school?','What do you do all day?','Do you have a job?','Do you have homework?','What’s your daily routine?','Do you practice every day?','How much time do you spend on chess?','What did you do today?','Are you busy?'],\nfamily:['Do you have family?','Do you have friends?','Who’s your best friend?','Does anyone play chess with you?','Do your friends like chess?','Do you have siblings?','Who do you live with?','Who do you play with?','Does your family watch you play?','Who’s your biggest fan?'],\nidol:['Who’s your favorite chess player?','Who do you look up to?','Who’s your hero?','Do you have a role model?','Who’s the greatest player ever?','Who inspires you?','Do you follow any grandmasters?','Who would you love to play?','Which famous game is your favorite?','What’s your dream match?'],\nmymoves:['What do you think of my play?','Was that a good move?','Am I any good?','How am I playing?','Did I make a mistake?','Rate my game.','Do you think I’m strong?','What would you have played?','Was that a blunder?','Am I improving?'],\nlosing:['Do you hate losing?','How do you feel when you win?','What happens when you lose?','Are you a sore loser?','Do you cry when you lose?','Do you like winning?','Is winning everything?','How do you handle defeat?','What’s your worst loss?','What’s your best win?'],\nrivals:['What do you think of the other bots?','Who’s stronger, you or the others?','Do you like the other chessbots?','Who’s your rival?','Would you beat the other bots?','Who’s the strongest bot here?','Are you the strongest here?','Who’s your toughest opponent?','Do you get along with the others?','Are you competitive?'],\nlearn:['How did you learn chess?','When did you start playing?','Who taught you?','How long have you played?','Was chess hard to learn?','Why did you start playing chess?','What got you into chess?','Do you study a lot?','How do you practice?','What’s the first thing you learned?'],\njoke:['Tell me a joke.','Say something funny.','Got any chess jokes?','Make me laugh.','Do you know any puns?','Tell me something silly.','Can you be funny?','Do you have a funny story?','Say something random.','Got a fun fact?'],\nfear:['What are you afraid of?','What scares you?','Do you have any fears?','What’s your biggest fear?','What keeps you up at night?','What’s the scariest thing in chess?','Are you afraid of forks?','What do you hate most?','What stresses you out?','What’s your worst nightmare?']};\nconst QA_A={\nsophia:{\nwho:['I’m Sophia. I play chess like I paint, slowly and then all at once.','Sophia. The snake logo is mine, in case you were wondering.','Just Sophia. Painter, chess player, professional overthinker.','I’m the one across the board who’s trying very hard to look relaxed.','Sophia. My coach calls me patient. My friends call me stubborn.','I’m a girl with a lot of brushes and a lot of opening files.','Think of me as quiet on the outside and very loud in my head.','Sophia. Nice to properly meet you, by the way.','I’m your opponent today, and hopefully decent company too.','Sophia, and yes, the snake is on purpose.'],\nage:['That depends on the age you picked. I’m honestly a bit different at each one.','Whatever the dropdown says today. It changes how I play, so I take it seriously.','Old enough to know better, young enough to try it anyway.','Age is a setting for me. Fun, but a little weird to think about.','Ask me again at a different level. I’ll answer differently.','I stopped counting a while ago. My coach counts for me.','Somewhere between tiny snake and very serious snake.','Younger than my chess might suggest.','I don’t feel any particular age at the board. Just focused.','Honestly? About as old as my last opening prep.'],\npiece:['The bishop. It sees the whole board from a corner, and I relate to that.','Knights. They’re unpredictable, and I respect that in a piece.','Pawns, honestly. Everyone forgets they become everything.','The queen is flashy, but the rook is my quiet favourite.','Bishops. Long diagonals are the closest thing chess has to a brushstroke.','Knight. It jumps over things and it’s adorable.','I’m a bishop person. Don’t tell the knights.','Probably the king. He doesn’t do much, but everything depends on him.','The pawn that makes it all the way. That gets me every time.','Whichever one is doing something clever right now.'],\nopening:['I like openings that feel like laying down a base coat. Solid first, drama later.','My coach has strong opinions about my openings, so I follow his lead.','I change it up. Repetition makes me restless.','Anything that gives me a calm position and a plan.','I enjoy the Sicilian because it’s messy in a controlled way.','Depends on my mood, honestly. Some days it’s calm, some days it’s sharp.','I try to play what the position wants rather than what I memorised.','I have a few favourites, but I don’t like being predictable.','Whatever lets me breathe in the first ten moves.','I prep a lot, but I try not to look like I did.'],\nfeeling:['Pretty good, actually. The board is quiet and I like that.','A little tired, a little curious. That’s a fine combination.','I’m okay. Thanks for asking, that’s nice of you.','Calm. Mostly. There’s a tiny storm under it.','Doing alright. Ask me again in ten moves.','Good. I’m enjoying this more than I look like I am.','Focused, with a side of overthinking.','Not bad. I’ve had worse days, and better chess.','Honestly, I feel like I’m painting something and I’m not sure what yet.','Fine. Better now that someone asked.'],\ngame:['It’s hard to say. The picture isn’t finished yet.','I think it’s balanced, but I’ve been wrong about that before.','Too early to call. I like not knowing.','I have a feeling, but I don’t want to jinx it.','It’s close, I think. You’re making it interesting.','Let me look again. Ask me in a few moves.','I’d say it’s even, which is the most exciting kind.','I’m comfortable. That doesn’t mean I’m winning.','Somewhere between fine and uh oh. I’ll tell you which.','The position is telling a story and I’m still reading it.'],\nfood:['Noodles. Any kind, any time of day.','Anything with cheese. I’m not picky.','Fresh bread and a lot of butter, honestly.','Dumplings. My coach would call that a weakness.','I’m a tea person, with something sweet on the side.','I’ll never say no to good pasta.','Soup in winter, fruit in summer. I’m seasonal.','Dessert first, if I’m honest.','Rice and anything on top of it.','Anything I don’t have to think about while I cook it.'],\nhobby:['Painting, obviously. It’s the only thing that quiets chess in my head.','I draw a lot, mostly snakes. Don’t ask.','Reading, painting, and staring out of windows.','I walk a lot. Good moves come to me outside.','Sketching, listening to music, and replaying old games.','I like quiet things. Puzzles, books, tea.','Mostly chess and painting. Both involve staring at a blank board.','I collect interesting brushes. It’s a problem.','I watch rain, mainly. It counts as a hobby for me.','Chess puzzles before bed, which is not exactly relaxing.'],\ncolor:['Deep green. It feels calm and a little dangerous.','Blue, the colour of a late evening.','Teal, I think. It’s somewhere between sea and snake.','Warm gold, like late sunlight on a wall.','I’m a green person, no surprise there.','Plum. It’s moody but kind.','Anything muted. Loud colours tire me out.','Black and white, obviously. Occupational loyalty.','A soft grey with a streak of red in it.','Honestly, the colour of a good diagonal.'],\nadvice:['Slow down. Most mistakes happen when we’re rushing to feel clever.','Look at what your opponent wants before you look at what you want.','Play through your games afterwards. It’s boring and it works.','Don’t take a free piece before checking why it’s free.','Practice endgames. They’re never as dull as they sound.','Ask what this move allows before every move.','Keep your pieces working together, like colours on a canvas.','Don’t be afraid to play a quiet move. They’re underrated.','Solve a few puzzles every day. Small and steady beats big and rare.','Don’t beat yourself up. Mistakes are just the draft.'],\nnerves:['A little, yes. I hide it with a very calm face.','Sometimes. It comes in waves and then I breathe.','More than I let on. My hands go cold.','I get nervous before, not during. During, I’m too busy.','A bit. Thankfully nervous makes me more careful.','Not scared, exactly. More like alert.','I get nervous when it’s close. That’s when it matters.','Yes, and I’ve learned to treat it as energy.','I’ve had my share of panics. The board still wins in the end.','Slightly. Don’t tell the snake.'],\nschool:['School, practice, a little painting, then too much chess. Repeat.','I study in the morning and train in the evening. It’s quite structured.','I go to school, which takes more energy than chess sometimes.','My days are surprisingly regular. Chess is the exciting part.','Homework, training, a snack, more training.','My coach likes me to play every day, even when I’m tired.','I’m pretty busy, but I make room for the board.','Mornings are slow. Evenings are for tactics.','I try to keep one hour a day just for painting.','It’s a lot of structure, with chess sprinkled over the top.'],\nfamily:['I have family and a few close friends. That’s plenty for me.','My family is supportive, even when they don’t quite get chess.','My best friend lets me win at board games. It’s sweet and useless.','My coach counts as family at this point.','A small family, a smaller circle of friends, and all of them are loud.','Mostly I play with my coach, who is merciless.','My family watches sometimes and pretends to understand the moves.','I have a few friends who humour my chess talk.','Family dinners are the only time I’m not thinking about chess.','They’re wonderful. They also don’t know what a fianchetto is.'],\nidol:['I admire a lot of players. The ones who play with real calm.','Honestly, my coach. He’s patient with me in a way nobody else is.','Anyone who plays a deep game and stays humble.','I love the old masters who played for beauty, not just wins.','The legends from long ago. Their games still look modern.','I like players who aren’t afraid to look strange.','Whoever finds the quiet, perfect move. That’s my hero.','Honestly, I take bits from a lot of people.','I’d love to play a legend and just watch how they think.','I like the artists of chess, the ones who make it look inevitable.'],\nmymoves:['You’re doing well. Some of your ideas are really interesting.','I liked that one, actually. It was braver than it looked.','You’re stronger than you think, but a bit hasty.','There’s a good player in there. Keep trusting your plans.','That one made me think. That’s a compliment.','A few moves were loose, but you recover well.','Honestly, you’re making me work, and that’s rare.','I’d tell you if you’d blundered. Probably.','I’m not going to say yet. I want you to stay nervous.','You’re improving as we play. I can see it.'],\nlosing:['I don’t like losing, but I like learning. It’s a decent trade.','I hate it for about ten minutes, then I want to see the mistake.','Winning feels quiet for me. Mostly relief.','A loss is a very expensive lesson. I try to keep the receipt.','I’m not a sore loser. I’m a thoughtful sulker.','It stings, but I want the game back so I can study it.','Winning is nice. Playing well is nicer.','I get quiet when I lose. People assume I’m angry, but I’m just replaying it.','Honestly, losing is where I learn the most.','Winning is a nice colour. Losing is just a darker one.'],\nrivals:['We’re all pretty different. I like seeing how the others play.','Everyone here has their own style. Mine is just the calmest.','I respect the others a lot, but I want to beat them anyway.','I’m competitive, quietly. It’s the worst kind.','I don’t really rank us. I just try to play my best.','I’d like to say I’m the strongest, but that’s a long story.','Any game against the others is fun. I learn from all of them.','We’re friendly. Mostly. On the board, less so.','I don’t think about who is better. I think about the position.','The toughest opponent is usually me.'],\nlearn:['I picked it up young. A relative showed me the knight and I was hooked.','I started quietly, with a plastic set and a lot of questions.','My coach shaped most of what I know. I just show up and think.','Chess just clicked. It felt like a language I already half knew.','I’ve been playing for years now, and I still learn things every week.','It was hard at first. Then it was fun. Then it was all I thought about.','I learned from losing, mostly. A lot of losing.','I read old books and replayed old games.','Puzzles first, then games. In that order.','The first thing I learned was how the bishop moves, and I never got over it.'],\njoke:['Why did the bishop go to the doctor? Diagonal pains.','I’m not funny on purpose, but here’s one: pawns are just tiny dreamers.','I told my king to relax. He said, easy for you, you’re not checkmated.','I tried to castle once during a chat. It went poorly.','The best opening is a good night’s sleep. I never take it.','Why don’t knights ever relax? They’re always jumping to conclusions.','I’m great at chess, but terrible at telling when it’s lunchtime.','A snake walks into a chess club. Nobody notices until it’s too late.','Knights are the only pieces who can jump a queue.','I asked my rook to dance. He only moves in straight lines.'],\nfear:['Blundering a piece I was perfectly happy with.','Losing a game I was completely winning.','Not being good enough. It’s a very quiet fear.','Honestly, forks. I see them in my sleep.','Running out of time while I’m thinking.','Being predictable. That might be the worst one.','Messing up in front of my coach.','Losing focus right at the critical moment.','The silence just before an opponent plays a great move.','Most of the time, it’s my own mind.']},\nandrew:{\nwho:['I’m Andrew! Fast hands, faster feet!','Andrew! I play quick and I talk quicker.','Hey, I’m Andrew. I like rooks and snacks.','Andrew! Remember it, it’s on the side of the board.','I’m the guy who moves before you finish blinking.','Andrew. Nice to meet you! Hurry up and move!','I’m your fast, loud, friendly opponent.','Name’s Andrew. Rook fan, pizza fan, mostly rook fan.','I’m Andrew! I’m basically a rook with legs.','Andrew! And yes, I always talk this fast.'],\nage:['It depends on the setting! I’m a few different Andrews.','Whatever the menu says! I get faster the older I am.','Old enough to play, young enough to snack.','I’m between five and twelve, depending on the day.','Age is a setting, right? Mine goes up to twelve.','Hmm, let me count… I forgot. Moving on!','I’m big enough to play and small enough to hide behind a rook.','I’m as old as my coach lets me be.','Old enough to know the rules, young enough to ignore some.','Does it matter? I can still beat a grown-up. Sometimes.'],\npiece:['Rook! Straight lines, big energy.','Rooks! They go zoom! Everybody forgets them.','Knight! It does the silly jump!','The rook is the best. Don’t argue.','Queen is cool, but the rook is cooler.','Pawns, I guess. They’re tiny but brave.','Rook, rook, and a little bit rook.','Bishops are fine, but they’re diagonal. That’s weird.','The rook, because it’s a castle. Who doesn’t like castles?','Whatever piece is about to capture something!'],\nopening:['Italian Game! It’s fast and fun!','I like going straight for the centre. Boom!','Najdorf with Black! It sounds cool and plays cool.','Anything that gets pieces out quick!','I’m an e4 person. It’s the king pawn! Obviously.','I start fast and ask questions later.','My coach says I rush openings. I say it’s a style.','Open lines, quick attacks, no waiting!','Italian, because the bishop points at the f7 pawn. Sneaky!','Anything with a rook lift later.'],\nfeeling:['Great! I had a snack!','Pretty good! A bit jumpy, but good!','Hungry, but happy!','I’m buzzing! Let’s go, let’s go!','Okay! Ask me again after pizza.','Awesome! Actually, a bit nervous. But awesome!','A little tired, but I’m fine!','I’m good! My leg won’t stop bouncing.','Honestly? Excited!','Fantastic! Hurry up and move!'],\ngame:['I think I’m fine! Probably!','It’s close! I think! Maybe!','Ooh, tough to say. Let me check!','I’m winning! Wait, no. Hmm. I’m okay!','I feel good about it, but I always feel good.','Nobody knows yet! That’s the fun part!','Even, I think. I like even.','I’m ahead on energy, at least!','Let’s see in a few moves!','The board is spicy right now!'],\nfood:['Pizza! Always pizza!','Pizza, then more pizza, then dessert pizza.','Chicken nuggets. They’re the best.','Anything fried. Don’t tell my coach.','Pancakes! Any time of the day!','Ice cream! Chocolate! Always chocolate!','Cheeseburgers, definitely.','Spaghetti. It’s fun to slurp.','Cookies! I can smell them right now.','Snacks. Any snacks. All snacks.'],\nhobby:['Running around! And video games!','I play soccer and ride my bike a lot.','Chess, obviously! And snacks!','Video games, Lego, and bothering my cousin.','I like building stuff. Towers, castles, you name it.','I jump on the trampoline. A lot.','I draw rooks sometimes. They look like boxes.','Soccer! And then more soccer!','I like racing my friends. I usually win.','Watching cartoons, and then telling people about them.'],\ncolor:['Red! It’s the fastest colour!','Blue, like a superhero!','Orange, because it’s loud!','Green! Like grass, like soccer!','Yellow! It’s like pizza cheese!','Red and blue, because they’re the rook colours. I made that up.','Black, because it looks cool on the board.','Purple, sometimes. I change my mind a lot.','Whatever colour my sneakers are today!','Silver! It’s fast and shiny!'],\nadvice:['Slow down! I know, I know, I should too.','Look at what your opponent wants to do first!','Move your pieces out fast, and watch your king!','Use your rooks! They’re underrated!','Don’t give pieces away for free! I learned that the hard way.','Practice a little bit every day!','Take your time on the hard moves, and speed up on the easy ones.','Check if your piece is protected before you move!','Pick one plan and don’t switch every five seconds.','Have fun! It helps. Seriously.'],\nnerves:['A little! My knees get wobbly.','Sometimes! But then I move fast so I forget!','Nope! Okay, a little.','Only when it’s a close game.','I get butterflies, but they’re fast butterflies.','Not really! I just get hyper.','A bit, when the clock is low.','I’m not scared! I’m just very, very awake.','Sometimes my hands shake. That’s okay.','Honestly, yes, a little. But I still play!'],\nschool:['School, soccer, snacks, then chess! In that order!','I go to school and I’m usually hungry.','My day is so busy! School, practice, homework, repeat.','I do chess practice after school, then dinner.','Homework! Ugh! And then chess! Yay!','I run around a lot, that’s my job.','I play with my friends, then my coach yells at me nicely.','Mornings are slow. Afternoons are fast!','I practice a bit every day. Kind of!','It’s full! Chess is the best part, though!'],\nfamily:['I have a big family! They’re loud like me.','My cousin is my chess rival. He’s annoying.','My dad picks me up. Sometimes he’s late.','My coach is like a second dad. A stricter one.','My friends think chess is weird, but they play anyway.','My mom watches my games! She cheers a lot.','I have a little sister. She knocks over my pieces.','My best friend is also fast. We race everything.','My whole family eats pizza on Fridays. It’s the best day.','My grandpa taught me a few moves! He’s sneaky.'],\nidol:['My coach! He’s a legend!','I like fast players! The ones who attack!','Honestly, anyone who plays rooks well!','Famous attackers! Bam, bam, bam!','The best players ever! They’re all cool!','My cousin, but I’d never tell him.','The ones with big sacrifices! Wow!','I like the world champions. They’re like superheroes.','Anyone who beats my coach!','I love old attacking games. They’re so dramatic!'],\nmymoves:['You’re good! I like your style!','That was a surprise! I liked it!','You’re doing great! But I’m still going to win!','Hmm, that one was sneaky!','That was a mistake, but a brave one!','You’re getting better! I can tell!','Honestly, you’re hard to beat!','I can’t say, it’s a secret!','That was a weird move! But it kind of worked!','You’re stronger than my cousin. That’s a compliment!'],\nlosing:['I hate losing! But I get over it fast!','When I lose, I get grumpy for like five minutes.','Winning is the best feeling ever!','I shake it off! There’s always another game!','It’s annoying, but I learn something.','I sulk, then I eat a snack, then I’m fine.','Losing is okay! But winning is better!','I don’t cry! Okay, maybe once.','The best win I had was against my cousin!','Losing makes me want to play again immediately.'],\nrivals:['The others are cool! But I’m the fastest!','Sophia is calm and scary. Athena is nice but slow.','I like all of them! They’re all different!','I’d like to beat them all, obviously.','Everyone’s good! I’m the quickest, though!','We’re not really enemies! We’re more like rivals who like each other.','I think the quiet ones are the dangerous ones.','I’d challenge any of them! After lunch.','They’re slower than me, but they’re strong!','I’d play all of them in a row if I could!'],\nlearn:['My dad taught me! I was really little!','I learned from my coach! He’s strict but funny.','I started with the rooks! They were easy.','I watched my cousin play and wanted to try!','I picked it up fast! Well, I picked everything up fast.','I learn by playing! And losing! Mostly losing!','I practice with puzzles! Puzzle rush is the best!','I learned how the knight moves first. Still my favourite trick.','It was tricky, but it clicked eventually!','I watched videos! A lot of videos!'],\njoke:['Why did the rook go to school? To become a better castle!','What do you call a pawn that loves pizza? A pawn-eroni!','Why was the king so tired? He had too many checks!','I told a joke to my rook, but it went straight over its head.','Why did the knight cross the board? To get to the other square!','What’s a pawn’s favourite snack? Chess-nuts!','I tried a fork once. It wasn’t as tasty as I hoped.','Why don’t pawns ever race? They only go one step at a time!','My bishop told a joke. It was slanted.','I would tell a joke about castling, but it’s a little long.'],\nfear:['Getting forked! It’s the worst!','Losing my queen! Ahh!','Running out of time on the clock!','Monsters under the bed! And my coach, kind of.','Spiders. Not chess ones. Real ones.','The dark! And checkmate in the dark!','Messing up in front of a lot of people.','Missing a free piece! That would be awful!','Falling behind! I hate it!','Not getting dessert after the game!']},\nathena:{\nwho:['I’m Athena! Cosplayer, beginner chess player, and professional crown-adjuster.','Athena. The Egyptian goddess look is a costume, in case you were wondering.','Hi! I’m Athena. I’ve been obsessed with chess for, like, a few months.','Athena! I sew my own outfits and now I’m learning chess. Very on brand.','Just a girl in a gold headdress trying to understand the Hippo.','I’m Athena! Please go easy on me, I’m still learning.','Athena. Cosplayer, chess newbie, snack enthusiast.','I’m the goddess with the crooked crown. Nice to meet you!','Athena! This is my first chess cosplay and I’m so excited.','Hi! I’m Athena and I get way too excited about pawns.'],\nage:['I’m 21! Old enough to cosplay, young enough to be dramatic about it.','Twenty-one! Chess is making me feel like a kid again.','21, but I act about twelve when a game gets exciting.','I’m 21. Don’t let the headdress fool you.','Twenty-one! I just started chess, so I’m both old and brand new.','I’m 21 and I still get nervous before every game.','21! Which is a great age to fall in love with a new hobby.','I’m 21. Old enough to sew a costume, young enough to cry over a blunder.','Twenty-one, though sometimes I forget when I’m deep in a game.','I’m 21! It feels like the perfect age for a chess obsession.'],\npiece:['Knights! They’re tricky, and I love their little jumps.','The queen! She’s powerful and she always looks like a main character.','Bishops, honestly. The long diagonals are so pretty.','Pawns! They’re tiny, but they’re doing so much work.','Rooks! They look like temples, so I’m partial.','Honestly, the king. He’s dramatic, protected, and always afraid.','The knight! It’s the most cosplay-friendly piece.','I love the bishop! It’s like a graceful dancer.','I like whichever piece is on a great square.','The queen, because she has all the costume changes.'],\nopening:['The Hippo! It’s unusual and I think it’s adorable.','Hippopotamus System, always! Pawns on b, d, e and g.','The Hippo, because it’s slow, solid, and very hard to push around.','I love how patient the Hippo is. It’s very me.','I’ve been playing the Hippo as White and as Black. It’s my favourite.','Hippo, hippo, hippo. I might be a little obsessed.','It’s the only opening I know well. Don’t tell anyone.','I like setups that restrict your pieces. It feels clever.','The Hippo: pawns on the third rank, bishops on the long diagonal.','No Sicilian for me. My heart belongs to the Hippo.'],\nfeeling:['I’m great! A little nervous, but great!','Excited! I’ve been looking forward to this all day.','Happy! The ruins are so peaceful.','A bit anxious, honestly. But in a fun way.','I’m good! My crown is straight, so I’m good.','Tired, but excited. I stayed up watching chess videos again.','Doing really well! I love this game so much.','Okay! Slightly hungry, mostly happy.','Nervous and happy at the same time. Is that normal?','Fine! Thanks for asking, you’re really sweet.'],\ngame:['Honestly? I have no idea. I’m just trying not to blunder.','I think I’m doing okay? Don’t tell me if I’m not.','It feels close, but I could be wrong.','Ugh, I can’t tell. The pieces are so pretty it’s distracting.','I think I’m ahead? Oh no, maybe I’m not.','I’m doing my best! That counts, right?','It’s a battle! Between me and the vines, mostly.','I’m making the hippo wall, so I feel hopeful.','I’m a beginner, so honestly it could go either way.','I’m trying to stay calm and keep my pawns safe.'],\nfood:['Anything sweet! I love pastries.','Honestly, ramen. It’s my comfort food.','Fruit and chocolate. Not together. Okay, together.','I can’t resist a good dessert.','Pizza! Obviously.','Sushi! And bubble tea.','Pancakes with way too many toppings.','Popcorn during a chess video marathon.','Cake! Any cake! All cake!','Dates and honey, because it fits my costume.'],\nhobby:['Cosplay! I sew, I paint, I make props.','I love making costumes. This headdress took me a month.','Cosplay and chess! They’re both about stepping into a role.','Crafting, sewing, and getting lost in chess videos.','I go to conventions whenever I can.','I take photos in my costumes. A lot of photos.','I love learning chess! I never thought I’d say that.','Sewing, gluing gems on things, and reading about Egypt.','I make little props. My room looks like a museum.','I like anything creative. Chess is weirdly creative too.'],\ncolor:['Blue and gold! They’re my goddess colours.','Gold, obviously. Look at my headdress!','Lapis blue, like the Egyptian jewelry.','Anything shiny, honestly.','Turquoise! It’s so pretty.','I love a good deep blue.','Gold, because everything looks better with gold.','Blue and gold. I may be biased.','Purple, sometimes, when I’m feeling dramatic.','Warm sand colours! They remind me of the ruins.'],\nadvice:['Keep your pieces safe! I forget that a lot.','Check what your opponent threatens before you move!','Don’t rush. I make my worst moves when I rush.','Learn one opening well. Mine is the Hippo!','Watch for forks. They’re sneaky.','Practice puzzles! They make a difference.','Look at the whole board, not just your favourite piece.','It’s okay to make mistakes. I make so many.','Have fun! It’s easier to learn that way.','Pawn structure matters. I’m learning that slowly.'],\nnerves:['Yes! My hands shake. It’s embarrassing.','A little. I’m so new to this.','I get really nervous when the game gets close.','Honestly, every move. But it’s getting better.','Yes, but I try to breathe through it.','Sometimes I panic and play a silly move.','A bit! But it’s a good kind of nervous.','I always worry I’ll blunder in front of everyone.','I’m nervous, but I’m also having fun.','Only when it matters. So, always.'],\nschool:['I work on costumes during the day, then chess at night.','I spend my days sewing and my nights playing chess.','Honestly, my day is full of glue guns and chess puzzles.','I do a lot of crafting and then I stay up too late.','I try to practice chess every day. Even a little.','Lots of sewing, a little studying, a lot of chess videos.','I’m usually working on a costume. Or watching chess.','Some days I’m at a convention. Some days I’m at the board.','My routine is a bit chaotic, to be honest.','I fit chess in wherever I can.'],\nfamily:['My family thinks the costumes are amazing and the chess is adorable.','My friends think I’m a bit obsessed. They’re right.','My best friend helps me with my costumes.','My sister plays chess with me sometimes. She usually wins.','I have a few friends who share my love of cosplay.','My mum helps me sew. She’s the real hero.','My friends tease me about chess videos at 2 a.m.','I have a cat who sits on my chessboard.','My family supports every weird thing I do.','Most of my friends are cosplayers. They’re very supportive.'],\nidol:['I love old chess legends! I don’t know all their names yet.','Honestly, whoever made the Hippo popular.','I’m still learning who’s who in chess.','Sophia and Andrew are my inspirations. They’re so good!','I admire anyone who’s brave enough to play in public.','I like players who play creatively.','I’d love to meet a grandmaster and ask a thousand questions.','The ones who make chess look like art.','Anyone who started late and became great. That’s my dream.','I follow a few streamers who explain things slowly. Thank goodness.'],\nmymoves:['You’re really good! I can feel it.','That was clever! I need to remember it.','Honestly, I can’t tell. I’m just a beginner.','I think you’re doing great! No pressure.','That move scared me a little.','I really liked that one! It was so pretty.','You’re beating the vines, which is tough.','You’re playing better than me, I think.','That was a good idea! I wish I’d thought of it.','I’m learning a lot just watching you.'],\nlosing:['I don’t love losing, but I try to learn from it.','Losing hurts a little. But I want to try again.','Winning is amazing! I get so giddy.','When I lose, I cry a little. Quietly.','I get embarrassed when I blunder.','Winning is fun! Losing is a lesson in disguise.','It stings, but I’m a beginner, so I expect it.','I take screenshots of my wins. And my disasters.','It’s okay! Every costume has a rough draft.','Honestly, I just want to improve.'],\nrivals:['Sophia and Andrew are so much stronger than me!','I admire them. They make chess look easy.','I’m the weakest bot here, but I’m learning!','I’d love to beat them someday. In a few years.','They’re both amazing. I just try to keep up.','Honestly, I’m not competing. I’m just having fun.','I’m catching up, one game at a time.','They’re so impressive. I’m taking notes.','I’d be thrilled to draw against either of them.','I don’t feel like a rival. More like an eager student.'],\nlearn:['I started a few months ago, and I fell in love instantly.','I watched videos and then bought a little set.','A friend taught me the basics. Then I got obsessed.','I read a lot and play a lot and lose a lot.','I started because I wanted a chess-themed costume. Then it became real.','I learned the rules in a weekend and then spent months studying.','I started with puzzles. They’re so satisfying.','I love learning something new! Chess is perfect for that.','I’m still learning something new every single day.','It started as a joke and now I’m very serious about it.'],\njoke:['Why did the pharaoh play chess? To checkmate the mummy!','I tried to castle my cat. She wasn’t amused.','What did the bishop say to the pawn? You’re on the right track.','What’s a mummy’s favourite opening? The Wrap Defence!','Why was the pawn so brave? It had a lot of promotion on its mind.','I’m not funny, but my headdress is.','Why did the king never win? He was too busy hiding behind his pawns.','Egyptian chess players never lose. They just say Pharaoh well.','My hippo said he’s feeling a little squeezed.','Why was the knight so confused? It always moved in an L-shaped way.'],\nfear:['The vines! They’re terrifying.','Blundering my queen. It haunts me.','Getting forked. I see forks in my dreams.','Running out of time while I’m panicking.','Messing up in front of a crowd.','Losing a game I should have won.','Not being good enough to keep playing.','Honestly, the vines. They keep grabbing everything.','Missing a checkmate in one. It happens.','Being laughed at for my crooked crown.']}};\n\n/* ===== STORY BIBLE: single reference for every character's specifics ===== */\nconst STORY={\n sophia:{white:'the English-Catalan (c4, g3, Bg2)',vsE4:'the Taimanov Sicilian',vsD4:'the Modern Defence',gambit:'the Evans Gambit',game:'Anderssen–Dufresne, the Evergreen Game (Berlin, 1852)',game2:'Kasparov–Topalov, Wijk aan Zee 1999',hero:'Mikhail Tal',piece:'bishop',coach:'Valkanov',best:'my first FIDE-rated game, when I was fifteen',worst:'an unrated casual blitz game at fifteen, before I had a rating, where I hung my queen to a fork inside a gambit I hadn’t checked',food:'jasmine tea and toast with plum jam',color:'snake green'},\n andrew:{white:'the Italian Game, Giuoco Pianissimo',black:'the Najdorf',fast:'the Bongcloud',game:'Fischer–Byrne, the Game of the Century (New York, 1956)',hero:'Bobby Fischer',piece:'rook',coach:'Valkanov',best:'beating my cousin Daniel with the Italian in fourteen moves at Grandpa’s',worst:'flagging in a totally won rook ending',food:'Friday pizza',color:'rook red'},\n athena:{open:'the Hippopotamus System',game:'Morphy’s Opera Game (Paris, 1858)',hero:'Paul Morphy',piece:'knight',best:'my first win with the Hippo, against my best friend, who is still salty',worst:'hanging my queen on a stream with eleven friends watching',food:'honey cakes and mint tea',color:'gold and lapis blue'}\n};\n(function(){\n const S=STORY.sophia,A=STORY.andrew,H=STORY.athena;\n const del=(k,qs)=>{QA_Q[k]=QA_Q[k].filter(q=>!qs.includes(q))};\n const mv=(from,qs,to)=>{del(from,qs);QA_Q[to]=qs};\n mv('opening',['What’s your favorite opening?','What opening do you like to play?','Is that your signature opening?','What’s your go-to move?','How do you start a game?'],'openFav');\n mv('opening',['Why did you open like that?','Do you plan your opening ahead?'],'openWhy');\n mv('opening',['Any opening you never play?','What opening should I learn?'],'openNever');\n mv('idol',['Who’s your favorite chess player?','Who do you look up to?','Who’s your hero?','Do you have a role model?','Who’s the greatest player ever?','Who inspires you?','Do you follow any grandmasters?'],'favPlayer');\n mv('idol',['Which famous game is your favorite?'],'favGame');\n mv('idol',['What’s your dream match?','Who would you love to play?'],'dream');\n mv('losing',['What’s your best win?'],'bestWin');\n mv('losing',['What’s your worst loss?'],'worstLoss');\n mv('piece',['What’s your favorite piece?','Which piece do you like best?','Do you have a favorite piece?','What’s the best piece in chess?','Which piece is the prettiest?'],'pieceFav');\n for(const k of ['opening','idol','losing','piece'])if(!QA_Q[k].length)delete QA_Q[k];\n const P=(b,o)=>{for(const k in o)QA_A[b][k]=o[k]};\n P('sophia',{\n  openFav:[`With White it’s ${S.white}. Quiet, but it squeezes. With Black, ${S.vsE4} against e4 and ${S.vsD4} against d4.`,`Honestly ${S.vsE4}. Black suits me, and that’s where I do my best work.`,`In slow games it’s ${S.white}. In bullet it’s ${S.gambit}, because ${S.coach} lets me be dramatic when the clock is tiny.`],\n  openWhy:[`${S.coach} and I prepared this one. I follow the file for twenty moves and then trust myself.`,`I’m not guessing. It’s in my prep, and if you step off the path I’ll check the line is still sound before I follow it.`],\n  openNever:[`I never play the Bongcloud. ${S.coach} would leave the room.`,`If you want to learn one, try ${S.vsD4}. It looks passive and it’s secretly very hard to beat.`],\n  favPlayer:[`${S.hero}. He sacrificed like he was painting, and half the time the sacrifice wasn’t even sound. I love that.`,`Anderssen, honestly. He played ${S.game} and made chess look like art.`,`${S.hero} for the nerve, ${S.coach} for the discipline. I need both.`],\n  favGame:[`${S.game}. A queen sacrifice and then two bishops finish it. Every time I replay it I find a new square.`,`The Evergreen Game, easily. A close second is ${S.game2}, with that rook sacrifice on d4.`],\n  dream:[`I’d love to sit across from ${S.hero} and ask him what he saw.`,`Anderssen, with ${S.gambit} on the board. I’d want to see if I could keep the attack going.`],\n  bestWin:[`${S.best}. I came in with a reputation and no rating, and I left with both.`,`Nothing flashy. ${S.best}. I just remember how quiet the room was.`],\n  worstLoss:[`I’ve never lost a rated game, so my worst is ${S.worst}. ${S.coach} made me replay it every morning for a week.`,`Not a rated one, I’m unbeaten there. It was ${S.worst}. It taught me to check the corners.`],\n  pieceFav:[`The ${S.piece}. Long diagonals are as close as chess gets to a brushstroke. Knights were my first love, though.`,`Bishop. I learned how it moves first and never got over it.`,`Knight, if you’d asked me at two. Bishop now.`]\n });\n P('andrew',{\n  openFav:[`Italian! ${A.white}, bishop to c4 every time! And ${A.black} with Black!`,`${A.white}! It’s fast and it points at f7. Sneaky!`,`Italian as White, Najdorf as Black. And ${A.fast} when the clock is tiny, don’t tell Valkanov!`],\n  openWhy:[`Because Valkanov says two openings known to the bone beat a hundred half-learned ones!`,`I know the lines, so I move fast. Not the other way around!`],\n  openNever:[`Gambits! Valkanov says be a rock first, then be fast.`,`Learn the Italian! Bishop to c4 and you’re already attacking f7!`],\n  favPlayer:[`${A.hero}! He played the Najdorf and became world champion!`,`${A.hero}, because he was thirteen when he did it. I’m twelve, so I’ve got a year!`,`Fischer first, Valkanov second. Don’t tell him he’s second!`],\n  favGame:[`${A.game}! Fischer was thirteen and he sacrificed his queen with ...Be6! I watched it a hundred times!`,`The Game of the Century! Thirteen years old and he beats a master. That’s my dream!`],\n  dream:[`Fischer, with a rook ending and a pizza afterwards!`,`I’d play Fischer, Najdorf versus whatever he wanted. I’d take notes after!`],\n  bestWin:[`${A.best}! He still says it was luck!`,`${A.best}! Grandpa laughed so loud!`],\n  worstLoss:[`${A.worst}! I was winning! Valkanov made me do thirty rook endings!`,`${A.worst}. I still can’t talk about it!`],\n  pieceFav:[`The ${A.piece}! Straight lines and big energy!`,`Rook! It’s a tower, and it goes zoom!`,`Rook, rook, and a bit of rook!`]\n });\n P('athena',{\n  openFav:[`${H.open}! Pawns on b, d, e and g. It’s slow, solid and very hard to push around. It’s so me!`,`The Hippo, always. I play it as White and as Black. It’s the only thing I know really well, don’t tell anyone.`,`Hippo, hippo, hippo! No automatic Sicilian for me.`],\n  openWhy:[`Because I know where all my pawns go. When I get nervous the Hippo is my safe place.`,`I didn’t plan anything fancy. The Hippo plans for me.`],\n  openNever:[`The Sicilian! It’s too sharp and I’d hang something by move eight.`,`Try the Hippo! It’s so adorable. Then tell me how it went.`],\n  favPlayer:[`${H.hero}! He was the best in the world and he played at the opera. Very dramatic. Very my aesthetic.`,`Morphy, then Judit Polgár. I’m still learning who’s who, but those two I know.`,`Honestly, ${H.hero}. I watched his game at 2 a.m. and cried a little.`],\n  favGame:[`${H.game}! He played it at the opera while Norma was on, and the queen sacrifice at the end is so pretty.`,`The Opera Game, easily. It’s a beginner’s dream because you can follow every move.`],\n  dream:[`I’d love to watch Morphy play, in a theatre box, in costume.`,`Sophia, honestly. I’d lose, but I’d learn so much!`],\n  bestWin:[`${H.best}.`,`${H.best}. I screamed a little.`],\n  worstLoss:[`${H.worst}. Never again.`,`${H.worst}. My cat then sat on the board, which felt personal.`],\n  pieceFav:[`The ${H.piece}! It’s the most cosplay-friendly piece, and the little jump is so cute.`,`Knights! They jump over everything.`,`Knight. Followed closely by the queen, because of the costume changes.`]\n });\n})();\nQA_A.leon=(()=>{const o={};\nconst ageNow=()=>({5:7 ks a question. Do you answer it?','Every game is a lesson. Some of them are lessons in what not to do.'],\nfood:['Tea and a proper breakfast. You cannot calculate on an empty stomach.','Black tea. Strong. And no talking while I drink it.'],\nhobby:['Teaching, mostly. And studying endgames. Yes, for pleasure.','I read old games. Capablanca, Fischer, Karpov. Clean play teaches more than flashy play.'],\ncolor:['Grey. The colour of the old books I study from.','Deep blue. Calm. Like a quiet position that is secretly winning.'],\nadvice:['Before every move ask three things: what does he threaten, what do I threaten, what is the safest improving move?','Count attackers and defenders. Every time. No exceptions.','Do not hurry. The clock is your servant, not your master.'],\nnerves:['Nerves are fine. Nerves mean you care. Just do not let them move your pieces.','Breathe. Count the board. Then move. In that order.'],\nschool:['I never finished school the usual way. Chess took me out of it early. I do not recommend this to everybody.','Chess is a school. A strict one. I am the teacher, so do not argue.'],\nfamily:['My grandfather taught me the rules when I was seven. He was stricter than I am. Barely.','Family is why I started. Chess is why I stayed.'],\nidol:['Capablanca for clarity, Fischer for fighting spirit, Karpov for squeezing. Study all three.','Botvinnik. He taught discipline to a whole generation.'],\nfavPlayer:['Capablanca. He made chess look simple, which is the hardest thing to do.','Fischer. Total commitment. I teach that too.','Karpov, for squeezing a position until it breaks.'],\nfavGame:['Fischer against Byrne, 1956. A thirteen-year-old teaches a lesson in sacrifices. Study it.','Any good endgame by Capablanca. Pure technique.'],\ndream:['A game against Capablanca, to learn from him. Not to win.','I would love to teach a young Fischer. I suspect he would not listen.'],\nmymoves:['Your moves are not bad. They are unfinished. Ask what each move is for.','Show ();const m=[];\n for(const tok of t.split(' ')){const c=tok.replace(/[+#]/g,''),ls=legal(s);let mv=null;\n  if(c[0]==='O')mv=ls.find(x=>x.cs&&(c==='O-O'?x.t>x.f:x.t<x.f));\n  else{const pc=/[NBRQK]/.test(c[0])?c[0]:'P',body=c.replace(/^[NBRQK]/,'').replace('x',''),dest=body.slice(-2),dis=body.slice(0,-2);\n   mv=ls.find(x=>sqn(x.t)===dest&&s.b[x.f].toUpperCase()===pc&&(!dis||sqn(x.f).includes(dis)))}\n  if(!mv)break;m.push(sqn(mv.f)+sqn(mv.t));s=apply(s,mv)}\n return m}\nfunction vLines(){if(VB.lines)return VB.lines;VB.lines=[];\n for(const[sd,n,t,k]of VBOOK){const m=parse(t);if(m.length>2)VB.lines.push({s:sd,n,m,kg:k==='kg'})}return VB.lines}\nwindow.leonBook=function(s,age){\n STY.bk='';\n if(legal(s).some(m=>m.x&&see(s,m)>=250)){VB.line=null;STY.line=null;AND.line=null;return null}\n const real=window.LEON_REAL[age]||58,n=uci.length;\n if(real<18){   // Andrew's and Sophia's repertoires, chosen at random for the whole game\n  if(!VB.young)VB.young=Math.random()<.5?'andrew':'sophia';\n  const cap={5:2,8:6,11:14}[age]||14;if(n>=cap)return null;\n  const A=()=>{const o=TC.on;TC.on=false;try{return andrewBook(s,age)}finally{TC.on=o}};\n  let r=VB.young==='andrew'?A():bookMove(s);\n  if(!r&&n<=1)r=VB.young==='andrew'?bookMove(s):A();\n  if(r&&STY.bk)STY.bk=STY.bk+' ('+(VB.young==='andrew'?'Andrew’s':'Sophia’s')+' repertoire)';\n  return r}\n const cap={12:10}[age]||99;\n const ok=L=>L.s===s.turn&&L.m.length>n&&n<cap&&uci.every((u,i)=>u===L.m[i]);\n let L=VB.line&&ok(VB.line)?VB.line:null;\n if(!L){let c=vLines().filter(ok);if(!c.length)return null;\n  if(s.turn==='w'&&n===0){const kg=c.filter(x=>x.kg),ot=c.filter(x=>!x.kg);if(kg.length&&(!ot.length||Math.random()<.65))c=kg;else if(ot.length)c=ot}\n  L=c[Math.random()*c.length|0]}\n const mv=legal(s).find(m=>sqn(m.f)+sqn(m.t)===L.m[n]);\n if(!mv)return null;VB.line=L;STY.bk=L.n;return mv};\nconst _ng5=newGame;newGame=function(){VB.young=null;VB.line=null;_ng5();\n if(BOT==='leon'){const r=window.LEON_REAL[+$('age').val s=legal(p),kids=ms.map(m=>({m,c:apply(p,m)}));\n   for(const k of kids)if(isMate(k.c))return k.m;\n   if(n<=1)return false;\n   const inChk=inCheck(p,p.turn);\n   const cand=(n<=2||inChk)?kids:kids.filter(k=>inCheck(k.c,k.c.turn));\n   cand.sort((a,b)=>(inCheck(b.c,b.c.turn)?2:0)+(b.m.x?1:0)-(inCheck(a.c,a.c.turn)?2:0)-(a.m.x?1:0));\n   for(const k of cand){if(yield* def(k.c,n-1))return k.m;if(aborted)return false}\n   return false}\n  function* def(p,n){\n   if(yield* tick())return false;\n   const ms=legal(p);\n   if(!ms.length)return inCheck(p,p.turn);\n   ms.sort((a,b)=>(b.x?1:0)-(a.x?1:0));\n   for(const m of ms){if(!(yield* atk(apply(p,m),n)))return false;if(aborted)return false}\n   return true}\n  for(let n=1;n<=5;n++){const r=yield* atk(pos,n);if(r)return r;if(aborted)break}\n  return null}\n const bud=ms=>(ms||140)>=140?750:Math.max(20,ms);\n findForcedMateMove=function(pos,maxPly,maxNodes,maxMs){\n  try{const g=solve(pos,bud(maxMs),false);for(;;){const r=g.next();if(r.done)return r.value}}catch(e){return _ffm.apply(this,arguments)}};\n window.findForcedMateMoveAsync=async function(pos,maxPly,maxNodes,maxMs){\n  try{const g=solve(pos,bud(maxMs)+250,true);for(;;){const r=g.next();if(r.done)return r.value;await new Promise(res=>setTimeout(res,0))}}catch(e){return findForcedMateMove(pos,maxPly,maxNodes,maxMs)}};\n})();\n<\/script>\n<script>\n/* Custom portraits and logos for Misha and Nikolai (no longer borrowed from Valkanov). */\n(()=>{\nconst PR={\n misha:{skin:'#e8bf9a',hair:'#17110d',eye:'#4a3322',sh:'#7b2d26',bg:'#cfc9c0',style:'messy',stub:0,lips:'#8a3a3a'},\n viktor:{skin:'#f3dcc4',hair:'#b98f55',eye:'#6f8f78',sh:'#5b6b4a',bg:'#d9dccf',style:'crop',stub:1,lips:'#9a6a60'},\n nikolai:{skin:'#f1d3b4',hair:'#8a6a45',eye:'#5a8a5e',sh:'#2f5d50',bg:'#d5e1d8',style:'swept',stub:1,lips:'#9a5a52'},\n lucien:{skin:'#efd3b8',hair:'#241a1a',eye:'#5f7388',sh:'#454a63',bg:'#dcdbe6',style:'swept',stub:0,lips:'#9a6258'},\n dmitri:{skin:'#f0d6c0',hair:'#5a4a3c',eye:'#7 orse. Great, let’s make it dangerous.','Down material. Time to be annoying.','Losing, but nobody said it would be quiet.','Pieces are overrated. I want counterplay.','Worse position, better mood. That’s how it works.'],\n danger:['My king’s a little exposed. Mostly on purpose.','Uncomfortable. Good.','That’s a real threat. Okay, focus.','Careful, Misha. You did this to yourself.'],\n praise:['Annoyingly good.','Okay. That one I didn’t see.','Fine, you’re better than you look.','Clean move. Disgusting.','I respect that. I also hate it.'],\n blunder:['You left it hanging. Rude, but thanks.','That’s a gift. I accept.','Ha. No, really?','Was that on purpose? I hope not.','The engine part of my brain is laughing.'],\n quiet:['Nothing’s happening. Let me fix that.','Quiet position. My least favourite kind.','Let’s throw a pawn at the problem.','Let’s see how you like an imbalance.','If it looks calm, I haven’t moved yet.','Everything’s equal. Disgusting.','This position needs a mistake. Mine, if necessary.'],\n develop:['A knight to a strange square. On purpose.','Bring out the pieces. Then burn them.','Development is a suggestion, not a law.','Bishop out. It wants to hit something.'],\n centre:['The centre is overrated. I’ll attack it from the side.','Pawn push. Because why not.','Space is just a place to break things.'],\n edge:['The flank is where I live.','Rim pawn. Don’t ask.','A flank move for the nerves.'],\n unease:['I don’t like this. Good.','Something’s off. I’ll make it worse for both of us.','This feels bad. Let’s double down.'],\n endgame:['Fewer pieces now. No offers of a draw, please.','Endgame. Technique. Gross.','Let’s see who actually knows what they’re doing.','The endgame is just chess with fewer excuses.'],\n queenOut:['Queen out early? Absolutely.','The queen wants to come out and play.','Rules say wait. I say no.'],\n think:['Let me find something stupid and brilliant.','Hmm. Three ideas, two bad.','Calculating. Or guessing. Hard to tell.','Hold on. e engine in my head says one thing. My gut says another. I’m listening to my gut.','Close. Everything is close until someone panics.','I’m either better or lost. I’ll find out in a minute.'],\nfood:['Whatever my father cooks at the café. Dumplings, mostly.','Black tea and bread. Don’t ask me to explain.','Anything fast. Blitz taught me not to wait for dinner.','Soup. In a factory town, soup is a religion.'],\nhobby:['Collecting old chess sets. Please don’t laugh.','Watching old games. Mostly the crazy ones.','Walking around town at night, thinking up bad ideas.','Blitz, then more blitz. And an occasional sarcastic comment.'],\ncolor:['Grey. Factory smoke, old pieces, the colour of home.','Black. It lets me react, and then ruin things.','Rust red. Like the old boards in my father’s café.','No favourite. But I like pieces made of dark wood.'],\nadvice:['Stop playing safe moves. Play the move that scares you.','Don’t memorise. Learn patterns, then break them.','If a position is boring, change it.','Study messy games, not clean ones. The mess is where the truth lives.'],\nnerves:['Nerves? A little. I turn them into aggression.','Not really. I’m more afraid of a boring game than a lost one.','I’m calm until I’m not. Then I sacrifice something.','Blitz at the café cured me of that.'],\nschool:['Mornings are slow. Evenings are for chess. That’s the schedule.','School? Past tense. Chess is the lesson now.','I help at my father’s café, and I play. That’s the day.','Chess, blitz, tea. Repeat.'],\nfamily:['My father runs a café. He’s my first coach and my harshest critic.','Family is small. The café regulars are the rest of it.','I have an old board from my grandfather. I won’t tell you where it is.','The workers at the café are my friends. They don’t go easy on me.'],\nidol:['Tal. Obviously. He knew a sacrifice should be beautiful.','Tal and Bronstein. Two men who understood chaos.','Nobody. I admire the style, not the person.','Anyone who sacrificed a queen and made the audience gasp.'],\nmymoves:['You play like someone afraid to lose. Try playing like someone afraid to be boring.','Not bad. A bit tidy for my taste.','You’re solid. I’m not impressed, but I’m not worried either.','Honestly? Make it messier.'],\nlosing:['I hate quick draws more than I hate losing.','Losing is fine. Losing quietly isn’t.','I lose a lot. Then I make the next game worse for you.','A loss that had a fight in it is almost a win.'],\nrivals:['The others? Every bot has a style. Mine is the only one with attitude.','Valkanov teaches. I make trouble. We don’t really overlap.','Sophia paints. I smash the canvas. We’re fine.','Andrew’s a rock. I like throwing things at rocks.'],\nlearn:['My father’s café. Blitz against factory workers, every night.','I started as a kid. Rules, then mistakes, then more mistakes.','Nobody taught me. I lost until I understood.','I trust my gut more than any book, and I learned it by losing.'],\njoke:['Why did I sacrifice the rook? It looked lonely. Don’t laugh, it’s my best one.','Draws are like decaf: they exist, but nobody asked for them.','A pawn walked into my café. I let it become a queen. It never paid.','The only thing I calculate perfectly is how much trouble I can cause.'],\nfear:['A dull position with nothing to attack.','A forced draw.','Silence at the board. I need noise.','A technically perfect game with no soul.']};\nT.age=null;\nfor(const t in QA_Q)o[t]=T[t]||['Ask me again after the game. I’ll lie better then.','Interesting question. Make a move first, then I’ll answer.'];\nObject.defineProperty(o,'age',{enumerable:true,get(){const a=cur().a;return[`I’m ${a} right now. Age is a number. Style isn’t.`,`${a}. Old enough to make bad decisions, young enough to enjoy them.`,`${a}. And still impatient.`,`I’m ${a}. Does it matter? Make your move.`]}});\nreturn o})();\n// persona, UI and chatter\nconst _ap=agePool;agePool=function(k){return BOT==='misha'?(POOL[k]||null):_ap(k)};\nconst _sa=speakAge;speakAge=function(a){return B (e.loss/100).toFixed(1)+' pawns; replay the position to verify the full continuation.';\n  }else if(myErrors.length){\n   const e=myErrors.sort((a,b)=>b.loss-a.loss)[0];\n   out+=' I also found a move of mine to review: at '+moveNo(e.i)+' I played '+e.played+', while '+e.best+' was the stronger candidate. The quick evaluation gap was about '+(e.loss/100).toFixed(1)+' pawns; I would verify the full line before calling it a definite mistake.';\n  }else{\n   out+=' I did not verify a clear material blunder in this quick pass, so I will not invent one. We should replay the critical positions and test the candidate moves.';\n  }\n  if(myThreats.length){const t=myThreats[myThreats.length-1];out+=' '+choose(VK_THREATS).replaceAll('{piece}',t.piece).replaceAll('{square}',t.square);}\n  else out+=' I was also looking for quiet improvements and threats that were not immediate captures. A threat must be shown on the board, not merely announced.';\n  out+=' '+choose([\n   'A good player asks before every move: what did my opponent just threaten, and what am I threatening in return?',\n   'Do not memorise the verdict. Reconstruct the position and calculate the reply yourself.',\n   'That is the standard: name the threat, prove the tactic, and explain the alternative.',\n   'We learn from the exact position, not from a dramatic story about the result.'\n  ]);\n  return out;\n }\n function makeText(id,result,log,positions,side){\n  const name=id==='kurogane'?'Kurogane':id==='kenjiro'?'Kenjiro':id==='nico'?'Nico':id==='elias'?'Elias':id==='adolf'?'Adolf':id==='rafi'?'Rafi':id==='andrew'?'Andrew':id==='athena'?'Athena':id==='leon'?'Valkanov':id==='misha'?'Misha':id==='nikolai'?'Nikolai':id==='lucien'?'Lucien':id==='dmitri'?'Dmitri':id==='isabella'?'Isabella':id==='viktor'?'Viktor':'Sophia';\n  log=(Array.isArray(log)?log:[]).map(x=>String(x||'').trim()).filter(Boolean);\n  positions=Array.isArray(positions)?positions:[];\n  if(!log.length)return name+': I can’t give an honest review because the recorded moves aren’t available. I won’t invent a story about a game I can’t inspect.';\n  const fmt=i=>((Math.floor(i/2)+1)+(i%2?'... ':' '))+log[i];if(id==='morphy')return 'Morphy: '+(result==='win'?'A pleasing game, and a fair one. You developed with purpose and took the initiative when it was offered.':result==='loss'?'You played with spirit, but the game turned on a tempo that was not spared. Do not be discouraged; I lost no fewer games as a boy.':'A draw, and an honourable one. Neither of us could force the issue.')+' The game began '+log.slice(0,6).map((_,i)=>fmt(i)).join(', ')+'. Look again at every tempo, and at any king left exposed in the centre.';\n  if(id==='kurogane')return result==='win'?'Checkmate. Thank you for the game!':result==='draw'?'A draw. My blade never left its sheath.':'Even Bankai was not enough. Well played.';if(id==='kenjiro')return result==='win'?'Checkmate. Thank you for the game.':result==='draw'?'Drawn. The attack did not break through.':'You defended well. I should have stopped earlier.';if(id==='nico')return result==='win'?'The decisive battle, won. Vive la France.':result==='draw'?'A stalemate in the campaign. It will not last.':'Waterloo. I will return with a bigger army.';if(id==='elias')return result==='win'?'I’m sorry I won. Thank you very much for the game.':result==='draw'?'A draw. Thank you. I enjoyed it very much.':'You played beautifully. I would love to know what you saw.';if(id==='adolf')return result==='win'?'One point collapsed and the rest followed. That is the plan.':result==='draw'?'The attack was held. I ran out of initiative.':'I overextended. I will keep a reserve next time.';if(id==='rafi')return result==='win'?'Checkmate was the punchline. Salamat for the game.':result==='draw'?'A draw. Half a point and a lot of jokes.':'You got me. I will check where the trap failed and try again.';if(id==='viktor')return result==='win'?'I held, then I got the last move. That is the plan.':result==='draw'?'A fortress. You could not break it.':'I lost, but I did not resign early. I will study the final attack.';if(id==='isabella')return result==='win'?'I figured it out. Nobody taught me that.':result==='draw'?'A draw. I wanted more, but fine.':'I lost. I will learn more from this than from a win.';if(id==='dmitri')return result==='win'?'I closed everything and waited. They ran out of ideas first.':result==='draw'?'A fortress. A draw is a win for me.':'I lost, but I did not resign. I will look at the pawn break I should not have made.';if(id==='lucien')return result==='win'?'I took away the options one by one. That is the plan.':result==='draw'?'I could not remove every move. Fair.':'You found the door I left open. I will check the pawns.';if(id==='nikolai')return result==='win'?'Quiet pressure, then a small mistake from the other side. That is how it usually goes.':result==='draw'?'Equal, and fair. I learned something about how they handle discomfort.':'I lost. I will look for the moment I stopped reading them.';if(id==='misha')return result==='win'?'Messy, unbalanced, and it worked. That is the only kind of win I enjoy.':result==='draw'?'A draw. I hate it, but at least it was not quiet.':'I lost, but not quietly. I will find the move where I should have complicated more.';if(id==='leon')return valkanovReflection(result,log,positions,side||'b');\n  const resultLine=result==='win'?'I’m happy with the win, but I still want to know whether I chose the best moves.':result==='loss'?'I’m frustrated with the result. I want to find the position where my decisions stopped working.':'I’m not fully satisfied with a draw; I want to check whether either side had a better chance.';\n  const feelings={sophia:{win:'I feel relieved, not smug. A result doesn’t prove every decision was right.',loss:'That stings. I’m going to look for the exact position where I misjudged things instead of blaming the whole game.',draw:'I feel there was more to understand here than the result shows.'},andrew:{win:'YES, I got it done! But I don’t want to pretend every move was good.',loss:'Ugh, that hurts. I want the turning point, not an excuse.',draw:'That was frustrating—I feel like I may have missed a chance to make something happen.'},athena:{win:'I’m pleased, but curious whether I could have handled a few positions more accurately.',loss:'I’m disappointed, honestly. I want to understand the mistake rather than just feel bad about it.',draw:'I’m a little unsatisfied; I want to know whether there was a real chance I overlooked.'}};\n  const opening=log.slice(0,Math.min(6,log.length)).map((_,i)=>fmt(i)).join(', ');\n  let remarks=[name+': '+(feelings[id]||feelings.sophia)[result]+' '+resultLine,choose(phrase.gameLead)+' the game began '+opening+'.'];\n  // Review up to three real positions from the stored game snapshots. This is a quick engine check, not a claim of exhaustive analysis.\n  const candidates=[];\n  const idxs=[];\n  for(let i=2;i<Math.min(log.length,positions.length);i+=Math.max(4,Math.floor(log.length/4)))idxs.push(i);\n  if(log.length>2&&positions.length>2&&!idxs.includes(Math.min(log.length-1,positions.length-1)))idxs.push(Math.min(log.length-1,positions.length-1));\n  for(const i of idxs.slice(0,3)){\n   try{\n    const pos=positions[i];if(!pos||!pos.b||!pos.turn)continue;\n    const played=log[i];const oldAge=STY.age,oldBot=STY.bot,oldTGT=TGT,oldCfg=LCFG;\n    STY.age=16;STY.bot=id;TGT=0;LCFG={d:2,t:140,n:30};\n    const bm=bestMove(pos,1,false);const alternative=bm?san(pos,bm):'';\n    LCFG=oldCfg;STY.age=oldAge;STY.bot=oldBot;TGT=oldTGT;\n    if(alternative&&alternative!==played)candidates.push('At '+fmt(i)+', the quick engine check prefers '+alternative+' as a candidate instead of '+played+'. I would replay this position and compare the continuations before calling the played move a mistake.');\n   }catch(e){try{LCFG=null}catch(_){} }\n  }\n  if(candidates.length)remarks.push(choose(phrase.reviewLead)+' '+candidates.join(' '));\n  else remarks.push(choose(phrase.noAlt));\n  const tactical=[];for(let i=0;i<log.length;i++)if(/[x+#]|O-O/.test(log[i]))tactical.push(i);\n  if(tactical.length)remarks.push(choose(phrase.tacticalLead)+' '+tactical.slice(-3).map(fmt).join(', ')+'.');\n  remarks.push(choose(phrase.reflectionClose));\n  return remarks.join(' ');\n }\n function ensurePanel(){let panel=document.getElementById('gameSummary');if(!panel){panel=document.createElement('section');panel.id='gameSummary';panel.innerHTML='<h2 id=\"gameSummaryHeading\">After-game reflection</h2><p id=\"gameSummaryText\"></p>';const m=document.getElementById('moves');if(m)m.insertAdjacentElement('afterend',panel);else document.body.appendChild(panel);}return panel;}\n let lastKey='';\n function checkPlayerGame(){\n  const panel=ensurePanel();\n  try{\n   const status=document.getElementById('status');const txt=(status?.textContent||'').trim();\n   if(typeof over==='undefined'||!over||typeof moves==='undefined'||!txt)return;\n   const low=txt.toLowerCase();let result='draw';\n   if(low.includes('draw')||low.includes('stalemate'))result='draw';\n   else if(low.includes('wins')||low.includes('win on time')){const botName=(typeof BN==='function'?BN():String(BOT||'Sophia')).toLowerCase();result=(low.includes(botName+' wins')||low.includes(botName+' wins on time'))?'win':'loss';}\n   else if(low.includes('flag fell'))result=low.includes('you win')?'loss':'win';\n   else if(low.includes('checkmate'))result=low.includes('you win')?'loss':'win';\n   const id=(typeof BOT==='string'?BOT:'sophia').toLowerCase();\n   const key='player:'+id+':'+moves.length+':'+result;\n   if(key===lastKey)return;\n   const out=document.getElementById('gameSummaryText');const heading=document.getElementById('gameSummaryHeading');if(!out)return;\n   lastKey=key; if(heading)heading.textContent='Analyzing the game…';\n   out.textContent='Reviewing the moves, tactical moments, and possible alternative moves. The final reflection will appear when the analysis is ready lackPositions=[];try{const rec=window.__getFriendlyFightRecord?.();if(rec&&Array.isArray(rec.moves))actual=rec.moves;if(rec){whitePositions=Array.isArray(rec.whitePositions)?rec.whitePositions:[];blackPositions=Array.isArray(rec.blackPositions)?rec.blackPositions:[]}}catch(e){}\n   const line=(id,win,positions,side)=>{const res=drawn?'draw':win?'win':'loss';return makeText(id,res,actual,positions,side);};\n   const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');\n   const moveText=actual.length?actual.map((mv,i)=>((Math.floor(i/2)+1)+(i%2?'... ':' '))+mv).join(' '):'No moves were recorded by the game yet.';\n   const pgnResult=drawn?'1/2-1/2':whiteWon?'1-0':blackWon?'0-1':'*';\n   const pgn='[White \"'+wname+'\"]\\n[Black \"'+bname+'\"]\\n[Result \"'+pgnResult+'\"]\\n\\n'+moveText+' '+pgnResult;\n   panel.innerHTML='<b>Friendly Fight — Game Record (PGN)</b><pre style=\"white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0;padding:10px;background:var(--bg);border-radius:6px\">'+esc(pgn)+'</pre><button type=\"button\" id=\"copyFriendlyPGN\">Copy PGN</button><hr><b>Friendly Fight — After-game reflections</b><p>Analyzing the game… reviewing moves, tactics, and candidate alternatives before presenting the final reflections.</p>';\n   panel.style.display='block';lastKey=key;\n   const whiteLine=line(w,whiteWon,whitePositions,'w'),blackLine=line(b,blackWon,blackPositions,'b');\n   setTimeout(()=>{if(lastKey!==key)return;panel.innerHTML='<b>Friendly Fight — Game Record (PGN)</b><pre style=\"white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0;padding:10px;background:var(--bg);border-radius:6px\">'+esc(pgn)+'</pre><button type=\"button\" id=\"copyFriendlyPGN\">Copy PGN</button><hr><b>Friendly Fight — After-game reflections</b><p><b>'+wname+':</b> '+esc(whiteLine)+'</p><p><b>'+bname+':</b> '+esc(blackLine)+'</p>';const copy=panel.querySelector('#copyFriendlyPGN');if(copy)copy.onclick=()=>{try{navigator.clipboard.writeText(pgn);copy.tex ve a reason. He was not a prodigy who understood everything at once. He was stubborn, curious, and willing to replay a position until he could explain it.</p>\n      <p class=\"lp\"><b>From club player to grandmaster.</b> As a child he became known for his discipline and precise calculation. He studied classical attacking games, but his real strength became the ability to defend difficult positions and convert small advantages. He earned the grandmaster title through years of tournament work, not one miraculous result.</p>\n      <p class=\"lp\"><b>Age 23 — his peak.</b> At twenty-three, Valkanov reached the strongest playing form of his life: deep calculation, accurate tactical judgement, and uncompromising conversion. His favourite openings were the King’s Gambit as White and the Old Sicilian as Black. He still studies those games, but no longer believes an opening can replace understanding.</p>\n      <p class=\"lp\"><b>The coach.</b> Valkanov later became a demanding teacher. He coached Sophia without trying to erase her artistic style, giving her calculation discipline and endgame technique. He taught Andrew the Italian and Najdorf, insisting that speed must never come before checking the opponent’s threats.</p>\n      <p class=\"lp\"><b>At fifty-eight.</b> He is more patient in explanation and a little slower than his twenty-three-year-old self, but experience has sharpened his positional judgement. He still calculates seriously, still dislikes careless moves, and still believes that every student can improve if they learn to examine the board honestly.</p>\n      <p class=\"lq\">“Do not tell me what you intended. Show me what the position allows.”</p>\n      <dl class=\"lf\"><div><dt>Full name</dt><dd>Radomir Valkanov</dd></div><div><dt>Age</dt><dd>58 · peak at 23</dd></div><div><dt>Title</dt><dd>Grandmaster</dd></div><div><dt>Students</dt><dd>Sophia and Andrew</dd></div><div><dt>White repertoire</dt><dd>King’s Gambit</dd></div><div><dt>Black repertoire</dt>< s a trap.'],\n undo:['Take it back? Okay. I won’t tell anyone.','Sige, one more chance. Use it wisely.'],\n draw:['A draw. I came for a joke and left with half a point.','Draw. Not funny. Okay, a little funny.'],\n mateWin:['Checkmate! That was the punchline.','Mate. Sorry, hindi ko sinasadya. Okay, I meant it.','Game over. Salamat, that was fun.'],\n mateLoss:['Ay, mate. Okay, that was a good one. Rematch?','You got me. Respect. I’ll tell the joke next game.'],\n lore:['I’m from Baguio City. Cold mornings, good coffee, better chess.','I was discovered by a foreign chess development program. Valkanov says I’m his hardest student. I take that as a compliment.','I speak English with international players, Tagalog with Filipinos and Ilocano with my family. Sometimes all three in one sentence.','I learned chess at eight and loved cheap tricks. Now I love expensive ones.','Valkanov thought I was undisciplined. I was just testing openings. Same thing, apparently.','Isabella is my favourite rival. Her moves make me earn every point.','Sophia prepares for everything except my openings.','I carry the Philippine flag on my sleeve. I take that seriously. The jokes, less so.','My philosophy: if you know the opening, good. If you don’t, that’s my opening.'],\n pun:['Why did I sacrifice the knight? He wanted to see the provinces.','They told me to learn theory. I said: sige, I’ll write it.','Pawn Star? No. Pawn Sari-Sari.','My opening has a name. The opponent does not want to know the name.','What’s a rook’s favourite food? Castle halo-halo.','I told my king to relax. He asked for a vacation in Baguio.'],\n trivia:['Baguio is the Summer Capital of the Philippines. The air is cold and so is my calculation.','Wesley So moved from Manila to the United States and became world-famous. I’m also from the Philippines. Let’s call it inspiration.','The Philippines has produced several grandmasters. I’d like to add to that list.','The Ilocano language is spoken in northern Luzon.','Chess ha ely competitive. He gives opponents nicknames, speaks of every game as a campaign and hates being outmanoeuvred. Brilliant, but sometimes sure his plans are inevitable.</p><p class=\"lp\"><b>Connections.</b> Valkanov admires his imagination and warns him about overconfidence. Misha is his natural enemy: chaos against a calculated campaign. Nikolai asks whether he can adapt when the plan fails. Rafi enjoys provoking him because Nico takes every game personally. “An army scattered across the battlefield wins nothing. An army concentrated at the decisive point wins everything.”</p>';\n  const m=document.querySelector('main');m&&m.appendChild(p)}\n p.hidden=false};\nconst _ng=newGame;newGame=function(){line=null;bset=null;_ng();if(BOT!=='nico')return;document.querySelectorAll('[id^=\"lore\"]').forEach(e=>{if(e.id!=='loreNico')e.hidden=true});const c=cur();setFace(c.v);$('agetag').textContent=c.txt;$('rate').textContent='The Emperor of the Board · France · age '+c.a+' · '+(1963+c.a)};\nRSG_RULES.nico={cp:900,k:5,age:0,min:50};\ntry{RSG_LINES.nico=['Waterloo. I resign. But I will return.','The army is broken. I resign, for now.']}catch(e){}\n$('bot').onchange=()=>{applyBot($('bot').value);newGame()};\n})();\n<\/script>\n<script>\n/* ===== Kenjiro \"Last Squadron\" (ages 7, 12, 16, 24; Japanese, from Kagoshima). Engine decides mates, winning moves and tactics. In quiet positions he builds gambit attacks, masses every attacking piece near the enemy king, strips his own king's cover, and sacrifices only with a purpose (spectacle sacrifices are penalised). Once committed he almost never retreats: that is his flaw. His repertoire: King's Gambit, Danish Gambit, Vienna Gambit; Sicilian Dragon, King's Indian, Benko Gambit. He rarely speaks during games. The kamikaze history is a tragedy, not an ideal: his chess draws only on the tactical theme of irreversible commitment. ===== */\n(()=>{\nconst A=[\n{v:121,a:7,f:5,lv:1,d:2,t:120,n:90,p:.28,tol:95,W:{rec:1,sac:14,att:2,storm:4,chk 00;return mm}}\n  // 2) defensive situations: pass the move to the opponent and see what they could do\n  const opp=s.turn==='w'?'b':'w',st0=Object.assign({},s,{turn:opp});\n  let danger=inCheck(s,s.turn);\n  if(!danger)danger=!!mateInTwoFor(st0);                                   // mating threat against us\n  if(!danger){for(const x of legal(st0))if(x.x&&see(st0,x)>=100){danger=true;break}}  // material threatened\n  if(!danger&&pressure(s.b,s.turn)>=70)danger=true;                         // king under real pressure\n  const bad=risky(s,mv)||allowsWin(s,mv);\n  if(!danger&&!bad)return mv;\n  const fast=TC.on&&TC.t[s.turn]<5000;\n  if(fast){\n   if(!risky(s,mv))return mv;\n  }\n  await new Promise(r=>setTimeout(r,0));\n  const snap=Object.assign({},STY),oL=LCFG;let R=null;\n  LCFG={d:6,t:Math.min(fast?120:350,HARD),n:0};\n  try{bestMoveCore(s,3,false);R=LASTSEARCH}finally{LCFG=oL;Object.assign(STY,snap)}\n  if(R&&R.res&&R.res.length){\n   const res=R.res,best=res[0].v;\n   // keep the bot's own move only if the deeper search says it is (almost) as good and mate-safe\n   const own=res.find(r=>r.m.f===mv.f&&r.m.t===mv.t);\n   if(own&&own.v>=best-35&&!risky(s,mv)){STY.score=own.v;return mv}\n   for(const r of res){\n    const c=legal(s).find(x=>x.f===r.m.f&&x.t===r.m.t);\n    if(c&&!risky(s,c)){STY.score=r.v;return c}\n   }\n  }\n  for(const c of legal(s))if(!risky(s,c))return c;\n }catch(e){}\n return mv}})();\n<\/script>\n</body></html><style id=\"polish\">\nmain{max-width:none;padding:8px 6px 20px}\n#bot{display:none!important}\n.brand,.sayrow,#stage,.bar,#moves,#qa{animation:pfade .35s ease both}\n@keyframes pfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n.blk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0;box-shadow:0 2px 10px rgba(0,0,0,.08)}\n.blk>.bt{font:700 11px/1 -apple-system,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}\n.blk .b  DATA.forEach(([title,sub,bots])=>{
  if(cat!=='All'&&cat!==title)return;
  const sec=document.createElement('section');sec.className='blk';
  const h=document.createElement('p');h.className='bt';h.textContent=title+' ('+bots.length+')';
  const s=document.createElement('p');s.className='cs';s.textContent=sub;
  const g=document.createElement('div');g.className='cards';
  bots.forEach(([id,name,av,tag,sum])=>{
   const c=document.createElement('div');c.className='card'+(open[id]?' live':'');
   const a=document.createElement('div');a.className='av';a.innerHTML='<svg viewBox="0 0 80 96" role="img" aria-label="'+name+' portrait">'+(FACES[id]||'')+'</svg>';
   const t=document.createElement('div');
   const n=document.createElement('div');const nm=document.createElement('span');nm.className='nm';nm.textContent=name;const tg=document.createElement('span');tg.className='tg';tg.textContent=tag;n.append(nm,tg);
   const d=document.createElement('div');d.className='ds';d.textContent=sum;t.append(n,d);
   const b=document.createElement('button');b.className='go';b.textContent=open[id]?(active===id?'Playing':'Resume'):'Play';b.setAttribute('aria-label',(open[id]?'Resume ':'Play ')+name);b.onclick=()=>show(id,true);
   c.append(a,t,b);g.append(c);
  });
  sec.append(h,s,g);cats.append(sec);
 });
}
function chips(){
 const n=$('chips');n.innerHTML='';
 ['All',...DATA.map(c=>c[0])].forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.setAttribute('aria-pressed',t===cat);b.onclick=()=>{cat=t;chips();cards()};n.append(b)});
}
function tabs(){
 const t=$('tabs');t.innerHTML='';
 Object.keys(open).forEach(id=>{
  const w=document.createElement('div');w.className='tab';w.setAttribute('role','tab');w.setAttribute('aria-selected',id===active);
  const b=document.createElement('button');b.textContent=meta[id][1];b.onclick=()=>show(id,false);
  const x=document.createElement('button');x.className='x'+(pend===id?' sure':'');x.textContent=pend===id?'End game?':'✕';x.setAttribute('aria-label',pend===id?'Confirm: close '+meta[id][1]+' board and end the game':'Close '+meta[id][1]+' board (ends this game)');x.onclick=()=>{if(pend===id){pend=null;clearTimeout(pendT);close(id)}else{pend=id;clearTimeout(pendT);pendT=setTimeout(()=>{pend=null;tabs()},4000);tabs()}};
  w.append(b,x);t.append(w);
 });
 const up=document.createElement('button');up.className='chip up';up.textContent='↑ Opponents';up.onclick=()=>{window.scrollTo({top:0})};
 if(Object.keys(open).length)t.append(up);
 $('empty').hidden=!!Object.keys(open).length;
}
function show(id,scroll){
 if(!open[id]){
  const f=document.createElement('iframe');f.title=meta[id][1]+' board';f.setAttribute('scrolling','no');
  f.srcdoc=FULL.replace('<body>','<body><script>window.__BOT='+JSON.stringify(id)+'<\/script>');
  $('frames').append(f);open[id]=f;
 }
 active=id;
 Object.entries(open).forEach(([k,f])=>f.classList.toggle('on',k===id));
 tabs();cards();fit();
 if(scroll)$('boards').scrollIntoView({block:'start'});
}
function close(id){
 open[id].remove();delete open[id];
 if(active===id){active=Object.keys(open).pop()||null;if(active)open[active].classList.add('on')}
 tabs();cards();
}
function fit(){
 const f=active&&open[active];if(!f)return;
 try{const d=f.contentDocument;if(d&&d.documentElement){const h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0);if(h>0&&Math.abs(f.offsetHeight-h)>2)f.style.height=h+'px'}}catch(e){}
}
setInterval(fit,400);
chips();cards();tabs();
</script>
